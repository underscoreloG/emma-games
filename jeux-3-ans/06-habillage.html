<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{width:100%;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.emo{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;line-height:1}
#start{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;gap:5vmin;align-items:center;justify-content:center;background:#ffd6a5;cursor:pointer}
#start .deco{font-size:18vmin}
#start .play{width:34vmin;height:34vmin;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 1.5vmin 0 rgba(0,0,0,.15);animation:pulse 1.4s ease-in-out infinite}
#start .play svg{width:50%;height:50%;margin-left:8%;fill:#9c6644}
@keyframes pulse{50%{transform:scale(1.08)}}
#sortie{position:fixed;top:max(10px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));width:min(max(9vmin,72px),84px);height:min(max(9vmin,72px),84px);border-radius:50%;background:rgba(255,255,255,.8);box-shadow:0 2px 6px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;z-index:200;cursor:pointer;opacity:.9}
#sortie svg{width:60%;height:60%}
#sortie:active{transform:scale(.9)}

body{background:linear-gradient(#e0fbfc,#c2dfe3)}
#app{position:fixed;inset:0;display:flex;flex-direction:row}
#left{flex:1.1;display:flex;align-items:center;justify-content:center;position:relative}
#left::after{content:"";position:absolute;left:12%;right:12%;bottom:4vh;height:5vh;border-radius:50%;background:rgba(0,0,0,.08)}
#bearBox{position:relative;height:78vh;max-width:92%;aspect-ratio:300/460;z-index:1;cursor:pointer;margin-top:8vh}
#bear{width:100%;height:100%;overflow:visible}
#bearAll{transform-origin:150px 450px}
#bearAll.wiggle{animation:wiggle .7s ease-in-out}
#bearAll.hop{animation:hop .6s ease-out}
@keyframes wiggle{20%{transform:rotate(-5deg)}40%{transform:rotate(5deg)}60%{transform:rotate(-3deg)}80%{transform:rotate(2deg)}}
@keyframes hop{40%{transform:translateY(-30px) scale(1.03,.97)}}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.happyEyes{display:none}
#bear.happy .eyes{display:none}
#bear.happy .happyEyes{display:inline}

/* Vêtements dessinés à la taille de Nounours */
.cl{opacity:0;pointer-events:none;transform-box:fill-box;transform-origin:center}
.cl.on{opacity:1;pointer-events:auto;cursor:pointer;animation:dropin .45s cubic-bezier(.3,1.5,.5,1)}
.cl.recolor{animation:recolor .4s ease-out}
.cl.off{opacity:1;animation:falloff .9s ease-in forwards}
@keyframes dropin{from{transform:translateY(-60px) scale(1.25);opacity:0}}
@keyframes recolor{50%{transform:scale(1.12)}}
@keyframes falloff{25%{transform:translate(20px,-40px) rotate(15deg)}100%{transform:translate(60px,520px) rotate(80deg);opacity:0}}
#i-balloon.on .float{animation:float 2s ease-in-out infinite}
@keyframes float{50%{transform:translate(4px,-8px)}}

#i-wand.on .twinkle{transform-box:fill-box;transform-origin:center;animation:twinkle 1.2s ease-in-out infinite}
@keyframes twinkle{50%{transform:rotate(20deg) scale(1.15)}}
#tray{flex:1.25;display:grid;grid-template-columns:repeat(5,1fr);gap:1.6vmin;padding:3vmin 3vmin 3vmin 1vmin;align-content:center}
.item.dice.roll{animation:roll .6s ease-out}
@keyframes roll{to{transform:rotate(360deg)}}
.item{aspect-ratio:1;border-radius:3vmin;background:#fff;display:flex;align-items:center;justify-content:center;font-size:min(8vmin,7vw);box-shadow:0 1vmin 0 rgba(0,0,0,.1);cursor:pointer}
.item.press{animation:press .3s}
.item.special{background:#ffd166}
@keyframes press{50%{transform:scale(.85)}}
@media (orientation:portrait){
  #app{flex-direction:column}
  #bearBox{height:40vh;margin-top:6vh}
  #tray{padding:2vmin 3vmin 3vmin;flex:none;grid-template-columns:repeat(6,1fr)}
  .item{font-size:min(7vw,5vh)}
}
.flyer{position:fixed;left:0;top:0;pointer-events:none;z-index:50;line-height:1;font-size:10vmin}
.spark{position:fixed;font-size:7vmin;margin:-3.5vmin 0 0 -3.5vmin;pointer-events:none;animation:spark .9s ease-out forwards;z-index:60}
@keyframes spark{0%{transform:scale(0) rotate(0)}40%{transform:scale(1.3) rotate(90deg)}100%{transform:scale(0) rotate(180deg);opacity:0}}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:40}
#flash.go{animation:flash .6s ease-out}
@keyframes flash{0%{opacity:.95}100%{opacity:0}}
#frame{position:absolute;inset:3vh 6%;border:1.6vmin solid #fff;border-radius:3vmin;box-shadow:0 0 0 .6vmin #ffd166,0 1.5vmin 3vmin rgba(0,0,0,.15);opacity:0;transform:scale(1.1);transition:opacity .3s,transform .3s;pointer-events:none;z-index:2}
#frame.on{opacity:1;transform:none}
#frame span{position:absolute;font-size:8vmin}

<script>
/* ===== Noyau commun : sons, démarrage, protections ===== */
const K = (() => {
  let ac = null, master = null;
  function ctx() {
    if (!ac) {
      const C = window.AudioContext || window.webkitAudioContext;
      if (!C) return null;
      ac = new C(); master = ac.createGain(); master.gain.value = 0.8; master.connect(ac.destination);
    }
    return ac;
  }
  function audio() { const c = ctx(); if (c && c.state === "suspended") c.resume(); return c; }
  function tone(f, d = 0.2, type = "sine", v = 0.25, f2 = null, delay = 0) {
    if (!ac) return;
    const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(v, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + d + 0.05);
  }
  function noise(d = 0.3, v = 0.3, freq = 800, delay = 0) {
    if (!ac) return;
    const n = Math.floor(ac.sampleRate * d), b = ac.createBuffer(1, n, ac.sampleRate), data = b.getChannelData(0);
    for (let i = 0; i < n; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2);
    const s = ac.createBufferSource(), fl = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = b; fl.type = "lowpass"; fl.frequency.value = freq; g.gain.value = v;
    s.connect(fl); fl.connect(g); g.connect(master); s.start(ac.currentTime + delay);
  }
  // Note tenue tant qu'on garde le doigt appuyé (renvoie la fonction qui l'arrête)
  function sustain(f, v = 0.2) {
    if (!ac) return () => {};
    const t = ac.currentTime, o = ac.createOscillator(), o2 = ac.createOscillator(), lfo = ac.createOscillator(), lg = ac.createGain(), g = ac.createGain(), g2 = ac.createGain();
    o.type = "triangle"; o.frequency.value = f; o2.type = "sine"; o2.frequency.value = f * 2; g2.gain.value = 0.3;
    lfo.frequency.value = 5.5; lg.gain.value = f * 0.012; lfo.connect(lg); lg.connect(o.frequency);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + 0.02); g.gain.setTargetAtTime(v * 0.55, t + 0.15, 0.4);
    o.connect(g); o2.connect(g2); g2.connect(g); g.connect(master);
    [o, o2, lfo].forEach(x => x.start(t));
    let done = false;
    const stop = () => {
      if (done) return; done = true;
      const n = ac.currentTime; g.gain.cancelScheduledValues(n); g.gain.setValueAtTime(Math.max(g.gain.value, 0.0002), n);
      g.gain.exponentialRampToValueAtTime(0.0001, n + 0.35); [o, o2, lfo].forEach(x => x.stop(n + 0.4));
    };
    setTimeout(stop, 4000);
    return stop;
  }
  const sfx = {
    pop: () => tone(520, 0.12, "sine", 0.3, 1200),
    boing: () => { tone(160, 0.5, "sine", 0.3, 480); tone(170, 0.5, "triangle", 0.08, 520); },
    chime: () => [784, 988, 1175, 1568].forEach((f, i) => tone(f, 0.6, "triangle", 0.14, null, i * 0.08)),
    tada: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, i === 3 ? 0.9 : 0.25, "triangle", 0.2, null, i * 0.12)),
    click: () => tone(1400, 0.05, "square", 0.06),
    whoosh: () => noise(0.4, 0.25, 1800),
    thud: () => { tone(140, 0.25, "sine", 0.45, 55); noise(0.12, 0.2, 500); },
    crash: () => { noise(0.8, 0.28, 700); tone(110, 0.5, "sine", 0.3, 50); },
    giggle: () => [880, 988, 880, 1047, 1175].forEach((f, i) => tone(f, 0.11, "sine", 0.14, f * 0.9, i * 0.09))
  };

  // Sons enregistrés : fichiers sons/<nom>.mp3, avec un repli synthétique si le fichier manque
  const FALLBACK = {
    pop: sfx.pop, boing: sfx.boing, whoosh: sfx.whoosh, ding: sfx.chime, fanfare: sfx.tada, bravo: sfx.tada,
    clic: sfx.click, bloc: () => tone(700, 0.08, "triangle", 0.3, 400), ecroulement: sfx.crash, rire: sfx.giggle,
    plop: () => tone(320, 0.15, "sine", 0.35, 160), pluie: () => noise(1.1, 0.12, 3500), eclaboussure: () => noise(0.6, 0.25, 2500),
    bulles: () => { for (let i = 0; i < 6; i++) tone(500 + Math.random() * 600, 0.07, "sine", 0.1, 1600, i * 0.09); },
    glou: () => { for (let i = 0; i < 4; i++) tone(300 + i * 40, 0.15, "sine", 0.25, 180, i * 0.3); },
    bisou: () => tone(1200, 0.12, "sine", 0.2, 500), photo: () => { noise(0.08, 0.3, 5000); tone(1800, 0.04, "square", 0.05); },
    coucou: () => [0, 0.6].forEach(d => { tone(784, 0.25, "sine", 0.25, null, d); tone(622, 0.4, "sine", 0.25, null, d + 0.25); }),
    porte: () => tone(300, 0.6, "sawtooth", 0.03, 420),
    croque: () => noise(0.15, 0.3, 3000),
    _: (n) => { let h = 0; for (const ch of n) h = (h * 31 + ch.charCodeAt(0)) % 997; const f = 330 + (h % 12) * 45; tone(f, 0.18, "triangle", 0.2, f * 1.5); tone(f * 1.5, 0.22, "triangle", 0.16, f, 0.16); }
  };
  const CLIPS = {};   // réglages par son : { start, dur, vol }
  const bank = {};
  function preload(names) {
    const c = ctx();
    names.forEach(n => {
      if (bank[n]) return;
      const e = bank[n] = { buf: null, el: null };
      const url = "sons/" + n + ".mp3";
      fetch(url).then(r => { if (!r.ok) throw new Error("absent"); return r.arrayBuffer(); })
        .then(ab => new Promise((res, rej) => c.decodeAudioData(ab, res, rej)))
        .then(b => { e.buf = b; })
        .catch(() => {
          // file:// ne permet pas fetch : on passe par un élément audio classique
          const a = new Audio(); a.preload = "auto";
          a.onerror = () => { e.el = null; };
          a.oncanplaythrough = () => { e.el = a; };
          a.src = url;
        });
    });
  }
  function snd(n, o = {}) {
    const e = bank[n], c = CLIPS[n] || {}, rate = o.rate || 1, vol = (o.vol ?? 1) * (c.vol ?? 1), dur = o.dur || c.dur;
    if (e && e.buf && ac) {
      const src = ac.createBufferSource(), g = ac.createGain(), t = ac.currentTime + (o.delay || 0);
      src.buffer = e.buf; src.playbackRate.value = rate; g.gain.value = vol;
      src.connect(g); g.connect(master);
      if (dur) {
        const end = t + dur / rate;
        g.gain.setValueAtTime(vol, Math.max(t, end - 0.12)); g.gain.linearRampToValueAtTime(0.0001, end);
        src.start(t, c.start || 0, dur);
      } else src.start(t, c.start || 0);
      return src;
    }
    if (e && e.el) {
      const a = e.el.cloneNode();
      a.volume = Math.min(1, vol);
      if (rate !== 1) { a.playbackRate = rate; a.preservesPitch = false; a.webkitPreservesPitch = false; }
      const go = () => { if (c.start) a.currentTime = c.start; a.play().catch(() => {}); if (dur) setTimeout(() => a.pause(), dur * 1000 / rate); };
      if (o.delay) setTimeout(go, o.delay * 1000); else go();
      return a;
    }
    const f = o.fb || FALLBACK[n];
    const run = () => f ? f(o) : FALLBACK._(n);
    if (o.delay) setTimeout(run, o.delay * 1000); else run();
    return null;
  }

  function fullscreen() {
    const d = document.documentElement, f = d.requestFullscreen || d.webkitRequestFullscreen;
    if (f) { try { const p = f.call(d); if (p && p.catch) p.catch(() => {}); } catch (e) {} }
  }
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  ["contextmenu", "gesturestart", "dblclick"].forEach(ev => document.addEventListener(ev, e => e.preventDefault()));
  document.addEventListener("touchmove", e => e.preventDefault(), { passive: false });
  // Petite flèche en haut à gauche : retour au menu
  const corner = document.createElement("a"); corner.id = "sortie"; corner.href = "index.html"; corner.setAttribute("aria-label", "Retour au menu");
  corner.innerHTML = '<svg viewBox="0 0 24 24"><path d="M3 11.5 L12 3.5 L21 11.5 M5.5 9.5 V20 H10 V14.5 H14 V20 H18.5 V9.5" fill="none" stroke="#2b2d42" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  document.body.appendChild(corner);
  corner.addEventListener("pointerdown", e => e.stopPropagation());
  function onStart(fn) {
    const s = document.getElementById("start"); let done = false;
    const go = e => {
      if (done) return; done = true;
      if (e && e.preventDefault) e.preventDefault();
      const c = audio();
      if (c) { const b = c.createBuffer(1, 1, 22050), src = c.createBufferSource(); src.buffer = b; src.connect(c.destination); src.start(0); }
      fullscreen(); s.remove(); document.removeEventListener("keydown", go);
      fn(e);
    };
    s.addEventListener("pointerdown", go); document.addEventListener("keydown", go);
  }
  return { tone, noise, sustain, sfx, snd, preload, CLIPS, rand, pick, shuffle, onStart };
})();

/* ===== Habille Nounours ===== */
const ITEMS = [
  { e: "👑", id: "crown" }, { e: "🎩", id: "tophat" }, { e: "🧢", id: "cap" }, { e: "👒", id: "straw" },
  { e: "👓", id: "glasses" }, { e: "🕶️", id: "sunglasses" }, { e: "🧣", id: "scarf" }, { e: "🎀", id: "bow" },
  { e: "🥳", id: "party" }, { e: "👕", id: "tee" }, { e: "👗", id: "dress" }, { e: "🧥", id: "coat" },
  { e: "👖", id: "pants" }, { e: "🩳", id: "shorts" }, { e: "👟", id: "sneakers" }, { e: "👢", id: "boots" },
  { e: "🧤", id: "gloves" }, { e: "🎈", id: "balloon" }, { e: "🌂", id: "umbrella" }, { e: "🪄", id: "wand" }
];
// Habillage au hasard : chance de mettre quelque chose à chaque endroit
const SLOTS = { hat: 0.85, eyes: 0.45, neck: 0.5, body: 0.9, legs: 0.55, feet: 0.8, hand: 0.5, paws: 0.3 };
const COLORS = ["#ef233c", "#fb8500", "#ffd60a", "#06d6a0", "#3a86ff", "#8338ec", "#ff70a6", "#2b2d42"];
K.preload(["pop", "rire", "boing", "whoosh", "ding", "photo", "bravo"]);
const bear = document.getElementById("bear"), bearAll = document.getElementById("bearAll"), tray = document.getElementById("tray");
const worn = {};  // emplacement -> id du vêtement porté

function again(el, c) { el.classList.remove(c); el.getBoundingClientRect(); el.classList.add(c); }
function center(el) { const r = el.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2 }; }
function part(id) { return document.getElementById("i-" + id); }
function sparkle(x, y) {
  const s = document.createElement("div"); s.className = "spark emo"; s.textContent = K.pick(["✨", "⭐", "💫"]);
  s.style.left = x + "px"; s.style.top = y + "px"; document.body.appendChild(s); setTimeout(() => s.remove(), 900);
}
function react() {
  again(bearAll, "wiggle"); bear.classList.add("happy");
  clearTimeout(react.t); react.t = setTimeout(() => bear.classList.remove("happy"), 1400);
  K.snd("rire", { delay: 0.1, dur: 1.2, vol: 0.8 });
}

function takeOff(slot) {
  const id = worn[slot]; if (!id) return;
  const g = part(id);
  g.classList.remove("on", "recolor"); again(g, "off");
  setTimeout(() => g.classList.remove("off"), 900);
  delete worn[slot];
}

function wear(item, btn) {
  const g = part(item.id), slot = g.dataset.slot;
  if (worn[slot] === item.id) {
    // Déjà porté : on change sa couleur
    if (g.style.getPropertyValue("--c")) {
      const cur = g.style.getPropertyValue("--c").trim();
      const next = COLORS[(COLORS.indexOf(cur) + 1) % COLORS.length];
      g.style.setProperty("--c", next);
    }
    again(g, "recolor"); K.snd("ding", { dur: 1, vol: 0.6 }); react();
    const c = center(g); sparkle(c.x, c.y);
    return;
  }
  takeOff(slot);
  worn[slot] = item.id;
  // L'icône vole jusqu'à Nounours, puis le vrai vêtement apparaît à sa taille
  const from = center(btn), to = center(g);
  const f = document.createElement("div"); f.className = "flyer emo"; f.textContent = item.e;
  document.body.appendChild(f);
  const w = f.getBoundingClientRect();
  const ax = from.x - w.width / 2, ay = from.y - w.height / 2, bx = to.x - w.width / 2, by = to.y - w.height / 2;
  f.animate([
    { transform: "translate(" + ax + "px," + ay + "px) scale(.6)" },
    { transform: "translate(" + (ax + bx) / 2 + "px," + (Math.min(ay, by) - 90) + "px) scale(1.1) rotate(-20deg)" },
    { transform: "translate(" + bx + "px," + by + "px) scale(.4)", opacity: 0.3 }
  ], { duration: 550, easing: "ease-in-out", fill: "forwards" });
  K.snd("whoosh", { vol: 0.6 });
  setTimeout(() => {
    f.remove();
    if (worn[slot] !== item.id) return;
    g.classList.remove("off"); again(g, "on");
    K.snd("pop"); react();
    const c = center(g); for (let i = 0; i < 3; i++) setTimeout(() => sparkle(c.x + K.rand(-40, 40), c.y + K.rand(-40, 40)), i * 80);
  }, 550);
}

function allOff() {
  Object.keys(worn).forEach(takeOff);
  again(bearAll, "hop"); K.snd("boing");
}

function photo() {
  const fl = document.getElementById("flash"), fr = document.getElementById("frame");
  again(fl, "go"); fr.classList.add("on"); bear.classList.add("happy");
  K.snd("photo"); K.snd("bravo", { delay: 0.5, dur: 2, vol: 0.7 });
  const b = document.getElementById("bearBox").getBoundingClientRect();
  for (let i = 0; i < 10; i++) setTimeout(() => sparkle(b.left + Math.random() * b.width, b.top + Math.random() * b.height), 300 + i * 90);
  setTimeout(() => { fr.classList.remove("on"); bear.classList.remove("happy"); }, 3200);
}

// Le dé : Nounours se déshabille, puis chaque vêtement tiré au sort vole jusqu'à lui, dans une couleur au hasard
let rolling = false;
function randomOutfit(btn) {
  if (rolling) return;
  rolling = true; again(btn, "roll");
  Object.keys(worn).forEach(takeOff);
  K.snd("boing");
  let picks = [];
  for (const [slot, p] of Object.entries(SLOTS)) {
    if (Math.random() < p) picks.push(K.pick(ITEMS.filter(it => part(it.id).dataset.slot === slot)));
  }
  if (picks.length < 2) picks = K.shuffle(ITEMS).slice(0, 3).filter((it, i, a) => a.findIndex(o => part(o.id).dataset.slot === part(it.id).dataset.slot) === i);
  picks.forEach((it, i) => setTimeout(() => {
    const g = part(it.id);
    if (g.style.getPropertyValue("--c")) g.style.setProperty("--c", K.pick(COLORS));
    wear(it, btn);
  }, 700 + i * 280));
  setTimeout(() => { rolling = false; }, 700 + picks.length * 280 + 600);
}

ITEMS.forEach(it => {
  const b = document.createElement("div"); b.className = "item emo"; b.textContent = it.e;
  b.addEventListener("pointerdown", e => { e.stopPropagation(); if (rolling) return; again(b, "press"); wear(it, b); });
  tray.appendChild(b);
});
[["🎲", randomOutfit, "dice"], ["📷", photo], ["🔄", allOff]].forEach(([ico, fn, cls]) => {
  const b = document.createElement("div"); b.className = "item special emo " + (cls || ""); b.textContent = ico;
  b.addEventListener("pointerdown", e => { e.stopPropagation(); again(b, "press"); fn(b); });
  tray.appendChild(b);
});

// Taper un vêtement porté le fait tomber, taper Nounours le fait rire
document.querySelectorAll(".cl").forEach(g => g.addEventListener("pointerdown", e => {
  if (!g.classList.contains("on")) return;
  e.stopPropagation();
  takeOff(g.dataset.slot); K.snd("boing");
}));
document.getElementById("bearBox").addEventListener("pointerdown", () => { react(); again(bearAll, "hop"); });

K.onStart(() => { K.sfx.chime(); });
</script>
<script id="fullscreen">/* Games always play fullscreen. A browser only allows it on a tap or a click, so it is asked on the first one (the big play button) and again if fullscreen was left. */
(function () {
  function go() {
    var d = document, e = d.documentElement;
    if (d.fullscreenElement || d.webkitFullscreenElement) return;
    var f = e.requestFullscreen || e.webkitRequestFullscreen;
    if (!f) return;
    try { var p = f.call(e, { navigationUI: "hide" }); if (p && p.catch) p.catch(function () {}); } catch (_) {}
  }
  ["pointerdown", "pointerup", "keydown"].forEach(function (t) { addEventListener(t, go, true); });
})();
</script>
