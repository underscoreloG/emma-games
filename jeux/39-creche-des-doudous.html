<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
:root{--bs:min(max(9vmin,72px),84px);--ink:#2b2d42;--bg:#fff3d6;--accent:#ef476f}
html,body{width:100%;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg)}
.emo{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;line-height:1}
#start{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;gap:5vmin;align-items:center;justify-content:center;background:#ffd6e0}
#start .deco{font-size:18vmin}
#start .play{width:34vmin;height:34vmin;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 1.5vmin 0 rgba(0,0,0,.15);animation:pulse 1.4s ease-in-out infinite}
#start .play svg{width:50%;height:50%;margin-left:8%;fill:var(--accent)}
@keyframes pulse{50%{transform:scale(1.08)}}
#sortie{position:fixed;top:max(10px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));width:var(--bs);height:var(--bs);border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 2px 6px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;z-index:200}
#sortie svg{width:60%;height:60%}
#sortie:active{transform:scale(.9)}
/* Blue square with 4 white squares: back to the day board */
.gb{position:fixed;top:max(10px,env(safe-area-inset-top));left:calc(max(10px,env(safe-area-inset-left)) + var(--bs) + 10px);width:var(--bs);height:var(--bs);border-radius:18px;border:0;background:#a0c4ff;display:none;grid-template-columns:1fr 1fr;gap:calc(var(--bs)*.07);padding:calc(var(--bs)*.2);box-shadow:0 5px 0 rgba(0,0,0,.15);z-index:40}
.gb i{background:#fff;border-radius:18%}
.gb:active,.act:active{transform:scale(.9)}
#pic{position:fixed;inset:0}
#pic svg{width:100%;height:100%;display:block;overflow:visible}
#acts{position:fixed;top:max(10px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));display:flex;gap:10px;z-index:40}
.act{width:var(--bs);height:var(--bs);border:0;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:calc(var(--bs)*.52);box-shadow:0 5px 0 rgba(0,0,0,.15);background:#cdb4db}
.act svg{width:58%;height:58%}
.spark{position:fixed;font-size:7vmin;margin:-3.5vmin 0 0 -3.5vmin;pointer-events:none;animation:spark .9s ease-out forwards;z-index:60}
@keyframes spark{0%{transform:scale(0) rotate(0)}40%{transform:scale(1.3) rotate(90deg)}100%{transform:scale(0) rotate(180deg);opacity:0}}
/* SVG: only opacity is animated in CSS (transforms are set from JS) */
.glow{fill:none;stroke:#ffd23f;stroke-width:16;pointer-events:none;animation:blink 1s ease-in-out infinite}
.soft{animation:blink 2.4s ease-in-out infinite}
.stink path{animation:blink 1.2s ease-in-out infinite}
.zz{animation:blink 2s ease-in-out infinite}
.np{pointer-events:none}
@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){#start .play,.glow,.soft,.stink path,.zz{animation:none!important}.spark{animation-duration:.3s}}
</style>

<div id="start"><div class="deco emo">🧸🍼</div><div class="play"><svg viewBox="0 0 100 100"><polygon points="30,20 30,80 82,50"/></svg></div></div>

<script>
"use strict";
/* ===== Shared core: sound (no voice), game clock, saving ===== */
const $ = id => document.getElementById(id);
let ac = null, master = null;
function audio() {
  if (!ac) {
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    ac = new C(); master = ac.createGain(); master.gain.value = 0.8; master.connect(ac.destination);
  }
  if (ac.state === "suspended") ac.resume();
}
function tone(f, d = 0.2, type = "sine", v = 0.25, f2 = null, delay = 0, out = null) {
  if (!ac) return;
  const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(v, t + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(out || master); o.start(t); o.stop(t + d + 0.05);
}
function noise(d = 0.3, v = 0.3, freq = 800, delay = 0) {
  if (!ac) return;
  const n = Math.floor(ac.sampleRate * d), b = ac.createBuffer(1, n, ac.sampleRate), data = b.getChannelData(0);
  for (let i = 0; i < n; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2);
  const s = ac.createBufferSource(), fl = ac.createBiquadFilter(), g = ac.createGain();
  s.buffer = b; fl.type = "lowpass"; fl.frequency.value = freq; g.gain.value = v;
  s.connect(fl); fl.connect(g); g.connect(master); s.start(ac.currentTime + delay);
}
const SFX = {
  pop: () => tone(480 + Math.random() * 260, 0.12, "sine", 0.3, 1200),
  plop: () => tone(330, 0.16, "sine", 0.35, 170),
  soft: () => tone(240, 0.1, "sine", 0.12, 200),
  whoosh: () => noise(0.35, 0.2, 1800),
  boing: () => { tone(160, 0.4, "sine", 0.3, 480); tone(170, 0.4, "triangle", 0.08, 520); },
  grow: () => tone(300, 0.25, "sine", 0.2, 700),
  giggle: () => [880, 988, 880, 1047, 1175].forEach((f, i) => tone(f, 0.11, "sine", 0.14, f * 0.9, i * 0.09)),
  chime: () => [784, 988, 1175, 1568].forEach((f, i) => tone(f, 0.6, "triangle", 0.14, null, i * 0.08)),
  tada: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, i === 3 ? 0.9 : 0.25, "triangle", 0.2, null, i * 0.12)),
  back: () => tone(700, 0.15, "sine", 0.2, 350),
  // crèche sounds (all synthesized, never a voice)
  gulp: () => tone(260, 0.12, "sine", 0.28, 170),
  burp: () => { tone(120, 0.3, "sawtooth", 0.1, 75); noise(0.22, 0.22, 320); },
  wipe: () => noise(0.28, 0.16, 3800),
  puff: () => { noise(0.22, 0.3, 900); noise(0.18, 0.2, 1400, 0.12); },
  snap: () => { tone(1800, 0.04, "square", 0.07); tone(1300, 0.05, "square", 0.05, null, 0.07); },
  paint: () => tone(420 + Math.random() * 300, 0.09, "sine", 0.1, 300),
  kiss: () => tone(1500, 0.08, "sine", 0.12, 2400)
};
// Game clock: timers and tweens run on it, so the game can be stepped when requestAnimationFrame is throttled
let now = 0, timers = [], tweens = [];
const ticks = [];
function after(ms, fn) { timers.push({ at: now + ms, fn }); }
// Game movements always play, even when the device asks for reduced motion; reduced motion only calms decorative CSS loops.
function tween(ms, fn, done) { tweens.push({ t0: now, ms, fn, done }); fn(0); }
function tick(dt) {
  now += dt;
  const due = timers.filter(t => t.at <= now); timers = timers.filter(t => t.at > now); due.forEach(t => t.fn());
  // tweens started by a finishing tween (chained moves) are kept: they land in the fresh list
  const running = tweens; tweens = [];
  const left = running.filter(w => { const k = Math.min(1, (now - w.t0) / w.ms); w.fn(k); if (k >= 1 && w.done) w.done(); return k < 1; });
  tweens = left.concat(tweens);
  ticks.forEach(f => f(dt));
}
let lastT = 0;
function frame(t) { tick(Math.min(50, lastT ? t - lastT : 16)); lastT = t; requestAnimationFrame(frame); }
requestAnimationFrame(frame);
function spark(x, y, e) {
  const s = document.createElement("div"); s.className = "spark emo"; s.textContent = e || "✨";
  s.style.left = x + "px"; s.style.top = y + "px"; document.body.appendChild(s); setTimeout(() => s.remove(), 950);
}
function burst() {
  SFX.tada(); const x = innerWidth / 2, y = innerHeight / 2;
  spark(x, y, "⭐"); spark(x - innerWidth * .2, y - innerHeight * .15); spark(x + innerWidth * .2, y - innerHeight * .1); spark(x, y + innerHeight * .2);
}
function load(key, def) { try { const m = JSON.parse(localStorage.getItem(key)); if (m && typeof m === "object") return m; } catch (_) {} return def; }
function store(key, o) { try { localStorage.setItem(key, JSON.stringify(o)); } catch (_) {} }
const hopAt = k => Math.sin(k * Math.PI);
const rand = n => Math.floor(Math.random() * n);
const ease = t => t < 0.5 ? 2 * t * t : 1 - 2 * (1 - t) * (1 - t);
function scenePt(svg, cx, cy) { const m = svg.getScreenCTM(); return m ? [(cx - m.e) / m.a, (cy - m.f) / m.d] : [0, 0]; }
function screenPt(svg, x, y) { const m = svg.getScreenCTM(); return m ? [m.a * x + m.e, m.d * y + m.f] : [innerWidth / 2, innerHeight / 2]; }
$("start").addEventListener("pointerdown", () => { audio(); $("start").style.display = "none"; SFX.chime(); if (window.onStart) window.onStart(); });
addEventListener("pointerdown", audio);
["contextmenu", "gesturestart", "dblclick", "selectstart", "dragstart"].forEach(t => addEventListener(t, e => e.preventDefault()));
addEventListener("touchmove", e => e.preventDefault(), { passive: false });

/* ===== The game ===== */
// The crèche of the plush babies. The day board is the hub: she taps picture cards to plan the day
// (bottle, diaper, shape sorter, painting), then plays each card in turn. Nap always ends the day.
const KEY = "creche-v1", mem = load(KEY, {});
if (!Array.isArray(mem.plan) || mem.plan.length !== 4) mem.plan = [null, null, null, null];
if (!Array.isArray(mem.done) || mem.done.length !== 4) mem.done = [false, false, false, false];
if (!Array.isArray(mem.pics)) mem.pics = [];
if (!Array.isArray(mem.cur)) mem.cur = [];
const save = () => store(KEY, mem);
const INK = "#2b2d42", DARK = "#3d405b";
const ACTS = ["feed", "change", "puzzle", "paint"];
const CARD_BG = { feed: "#caffbf", change: "#a0c4ff", puzzle: "#ffd6a5", paint: "#ffc6ff", nap: "#bdb2ff" };
const ST = `stroke="${INK}" stroke-width="5" stroke-linejoin="round"`;
let uidN = 0;
const uid = () => "u" + (++uidN);

// Layout: one coordinate space per orientation, the SVG letterboxes and the backgrounds overflow past the edges
let PORT = false, W = 1600, H = 1000;
function measure() { PORT = innerHeight > innerWidth; W = PORT ? 1000 : 1600; H = PORT ? 1600 : 1000; }

// --- the four plush babies (content: edit this list to match the real doudous)
const BB = [
  { fur: "#c68b59", light: "#f3d9bf", ear: "round", limb: "#c68b59" },               // ourson
  { fur: "#f8f4ef", light: "#ffd6e0", ear: "long", limb: "#f8f4ef" },                // lapin
  { fur: "#eab676", light: "#fff3dc", ear: "flop", limb: "#eab676", patch: "#a86b32" }, // chiot
  { fur: "#ffffff", light: "#ffffff", ear: "panda", limb: DARK }                       // panda
];
// Baby drawn sitting, feet at (0,0), about 240 wide and 330 tall
function babyInner(i, o) {
  const b = BB[i], eyes = o.eyes || "open", mouth = o.mouth || "smile", dia = o.diaper || "clean";
  const panda = b.ear === "panda", lc = panda ? "#fff" : INK;
  let s = "";
  if (b.ear === "round" || panda) {
    const f = panda ? DARK : b.fur;
    s += `<circle cx="-58" cy="-292" r="30" fill="${f}" ${ST}/><circle cx="58" cy="-292" r="30" fill="${f}" ${ST}/>`;
    if (!panda) s += `<circle cx="-58" cy="-292" r="14" fill="${b.light}"/><circle cx="58" cy="-292" r="14" fill="${b.light}"/>`;
  }
  if (b.ear === "long") s += `<ellipse cx="-36" cy="-338" rx="22" ry="62" fill="${b.fur}" ${ST} transform="rotate(-12 -36 -300)"/><ellipse cx="-36" cy="-338" rx="10" ry="44" fill="${b.light}" transform="rotate(-12 -36 -300)"/>` +
    `<ellipse cx="36" cy="-338" rx="22" ry="62" fill="${b.fur}" ${ST} transform="rotate(12 36 -300)"/><ellipse cx="36" cy="-338" rx="10" ry="44" fill="${b.light}" transform="rotate(12 36 -300)"/>`;
  s += `<ellipse cx="0" cy="-100" rx="80" ry="84" fill="${b.fur}" ${ST}/>`;
  if (!panda) s += `<ellipse cx="0" cy="-116" rx="46" ry="42" fill="${b.light}"/>`;
  if (dia !== "none") s += `<path d="M-79 -78 Q-84 -6 -36 0 L36 0 Q84 -6 79 -78 Q0 -50 -79 -78Z" fill="${dia === "dirty" ? "#efdcaa" : "#fff"}" ${ST}/>` +
    `<rect x="-74" y="-80" width="24" height="16" rx="6" fill="#a0c4ff" ${ST}/><rect x="50" y="-80" width="24" height="16" rx="6" fill="#a0c4ff" ${ST}/>` +
    (dia === "dirty" ? `<ellipse cx="10" cy="-26" rx="16" ry="9" fill="#c9a66b"/>` : `<circle cx="0" cy="-30" r="8" fill="#ffadc6"/>`);
  s += `<ellipse cx="-48" cy="-16" rx="34" ry="24" fill="${b.limb}" ${ST}/><ellipse cx="48" cy="-16" rx="34" ry="24" fill="${b.limb}" ${ST}/>` +
    `<ellipse cx="-48" cy="-14" rx="14" ry="9" fill="${panda ? "#6d6875" : b.light}"/><ellipse cx="48" cy="-14" rx="14" ry="9" fill="${panda ? "#6d6875" : b.light}"/>`;
  s += `<ellipse cx="-80" cy="-126" rx="22" ry="42" fill="${b.limb}" ${ST} transform="rotate(28 -80 -126)"/><ellipse cx="80" cy="-126" rx="22" ry="42" fill="${b.limb}" ${ST} transform="rotate(-28 80 -126)"/>`;
  if (o.bib) s += `<path d="M-50 -166 Q0 -128 50 -166 Q54 -110 0 -98 Q-54 -110 -50 -166Z" fill="#ffadad" ${ST}/><circle cx="0" cy="-124" r="9" fill="#fff"/>`;
  s += `<circle cx="0" cy="-232" r="84" fill="${b.fur}" ${ST}/>`;
  if (b.ear === "flop") s += `<ellipse cx="-82" cy="-226" rx="26" ry="54" fill="${b.patch}" ${ST} transform="rotate(16 -82 -226)"/><ellipse cx="82" cy="-226" rx="26" ry="54" fill="${b.patch}" ${ST} transform="rotate(-16 82 -226)"/>`;
  if (panda) s += `<ellipse cx="-32" cy="-246" rx="22" ry="27" fill="${DARK}" transform="rotate(-25 -32 -246)"/><ellipse cx="32" cy="-246" rx="22" ry="27" fill="${DARK}" transform="rotate(25 32 -246)"/>`;
  s += `<ellipse cx="0" cy="-200" rx="40" ry="30" fill="${panda ? "#fff" : b.light}"/><ellipse cx="0" cy="-214" rx="13" ry="9" fill="${INK}"/>`;
  s += `<circle cx="-56" cy="-200" r="13" fill="#ff8fab" opacity=".5"/><circle cx="56" cy="-200" r="13" fill="#ff8fab" opacity=".5"/>`;
  for (const x of [-32, 32]) {
    if (eyes === "open") s += panda ? `<circle cx="${x}" cy="-246" r="10" fill="#fff"/><circle cx="${x}" cy="-245" r="6" fill="${INK}"/>`
      : `<circle cx="${x}" cy="-246" r="11" fill="${INK}"/><circle cx="${x + 4}" cy="-250" r="3.5" fill="#fff"/>`;
    else if (eyes === "happy") s += `<path d="M${x - 14} -242 Q${x} -260 ${x + 14} -242" fill="none" stroke="${lc}" stroke-width="7" stroke-linecap="round"/>`;
    else s += `<path d="M${x - 14} -250 Q${x} -236 ${x + 14} -250" fill="none" stroke="${lc}" stroke-width="7" stroke-linecap="round"/>`;
  }
  if (mouth === "o") s += `<ellipse cx="0" cy="-188" rx="10" ry="12" fill="#9e2a2b" stroke="${INK}" stroke-width="4"/>`;
  else s += `<path d="M-15 -193 Q0 -178 15 -193" fill="none" stroke="${INK}" stroke-width="5" stroke-linecap="round"/>`;
  if (o.stink) s += `<g class="stink np">` + [-128, 128, 150].map((x, j) => `<path d="M${x} ${-30 - j * 40} q-16 -22 0 -44 q16 -22 0 -44" fill="none" stroke="#8ac926" stroke-width="8" stroke-linecap="round"/>`).join("") + `</g>`;
  return s;
}
// Every baby on screen keeps its look in bo[i]; p is an id prefix (two drawings of one baby never share ids)
const bo = [{}, {}, {}, {}];
function babyG(i, x, y, s, k = "baby", p = "b") {
  return `<g transform="translate(${x} ${y}) scale(${s})"><g id="${p}h${i}"><g id="${p}a${i}" data-k="${k}" data-i="${i}">${babyInner(i, bo[i])}</g></g></g>`;
}
function setB(i, patch, p = "b") { Object.assign(bo[i], patch); const el = $(p + "a" + i); if (el) el.innerHTML = babyInner(i, bo[i]); }
function hop(i, p = "b", hgt = 50) {
  const el = $(p + "h" + i); if (!el) return;
  tween(420, k => el.setAttribute("transform", `translate(0 ${-hgt * hopAt(k)}) scale(${1 + 0.06 * hopAt(k)} ${1 - 0.04 * hopAt(k)})`));
}
function wiggle(el) { if (el) tween(360, k => el.setAttribute("transform", (el.dataset.t || "") + ` rotate(${Math.sin(k * Math.PI * 4) * 9 * (1 - k)})`)); }
// babies blink now and then
const blinkAt = [2500, 4000, 3200, 5200];
ticks.push(dt => {
  for (let i = 0; i < 4; i++) {
    blinkAt[i] -= dt;
    if (blinkAt[i] > 0) continue;
    blinkAt[i] = 2500 + Math.random() * 4000;
    if ((bo[i].eyes || "open") === "open" && $("ba" + i)) { setB(i, { eyes: "closed", blink: 1 }); after(150, () => { if (bo[i].blink) setB(i, { eyes: "open", blink: 0 }); }); }
  }
});
function setEyes(i, eyes) { bo[i].blink = 0; setB(i, { eyes }); }

// --- objects
function bottleArt(level, id) {
  const c = uid(), mh = 168 * level;
  return `<path d="M-18 -112 Q0 -142 18 -112 L24 -86 L-24 -86Z" fill="#f7c59f" ${ST}/>` +
    `<rect x="-42" y="-90" width="84" height="32" rx="9" fill="#a0c4ff" ${ST}/>` +
    `<clipPath id="${c}"><rect x="-46" y="-60" width="92" height="170" rx="30"/></clipPath>` +
    `<rect x="-46" y="-60" width="92" height="170" rx="30" fill="#cfe6ff"/>` +
    `<rect ${id ? `id="${id}"` : ""} clip-path="url(#${c})" x="-46" y="${110 - mh}" width="92" height="${mh}" fill="#fffdf7"/>` +
    `<path d="M-28 -24 H-6 M-28 16 H-6 M-28 56 H-6" stroke="#7d9cc6" stroke-width="5" stroke-linecap="round"/>` +
    `<rect x="-46" y="-60" width="92" height="170" rx="30" fill="none" ${ST}/>`;
}
function diaperArt(dirty) {
  return `<path d="M-95 -50 Q-100 40 -40 56 L40 56 Q100 40 95 -50 Q0 -14 -95 -50Z" fill="${dirty ? "#efdcaa" : "#fff"}" ${ST}/>` +
    `<path d="M-90 -44 Q0 -8 90 -44" fill="none" stroke="#a0c4ff" stroke-width="10" stroke-linecap="round"/>` +
    `<rect x="-104" y="-64" width="32" height="24" rx="8" fill="#ffd166" ${ST}/><rect x="72" y="-64" width="32" height="24" rx="8" fill="#ffd166" ${ST}/>` +
    (dirty ? `<ellipse cx="8" cy="22" rx="22" ry="12" fill="#c9a66b"/>` : `<path d="M0 34 C-22 18 -14 2 0 12 C14 2 22 18 0 34Z" fill="#ff8fab"/>`);
}
const SHAPES = {
  circle: "M-68 0a68 68 0 1 0 136 0a68 68 0 1 0 -136 0Z",
  square: "M-60 -60H60V60H-60Z",
  triangle: "M0 -70L74 60H-74Z",
  heart: "M0 64 C-96 4 -72 -72 0 -30 C72 -72 96 4 0 64Z",
  star: (() => { let d = ""; for (let j = 0; j < 10; j++) { const a = -Math.PI / 2 + j * Math.PI / 5, r = j % 2 ? 32 : 76; d += (j ? "L" : "M") + (Math.cos(a) * r).toFixed(1) + " " + (Math.sin(a) * r + 6).toFixed(1); } return d + "Z"; })()
};
const PCOL = ["#ef476f", "#118ab2", "#ffd166", "#06d6a0", "#9b5de5", "#f78c6b"];
function sorterArt() {
  return `<rect x="-92" y="-62" width="184" height="124" rx="18" fill="#e9c46a" ${ST}/>` +
    `<g transform="translate(-48 -8) scale(.36)"><path d="${SHAPES.circle}" fill="#6b4f3a"/></g><g transform="translate(0 -8) scale(.36)"><path d="${SHAPES.star}" fill="#6b4f3a"/></g><g transform="translate(48 -8) scale(.36)"><path d="${SHAPES.square}" fill="#6b4f3a"/></g>` +
    `<g transform="translate(34 -78) scale(.42)"><path d="${SHAPES.heart}" fill="#ef476f" ${ST}/></g>`;
}
function cardIcon(kind, sz) {

SC.board = {

// Tap a baby: it climbs into its cradle. Tap again: blanket, it falls asleep. All asleep: tap the mobile for the lullaby, night falls.
let lull = null;

function lullaby() {
  if (!ac) return 7000;
  stopLullaby(); lull = ac.createGain(); lull.gain.value = 1; lull.connect(master);
  // Au clair de la lune (traditional), music-box style
  const N = [[392, 1], [392, 1], [392, 1], [440, 1], [494, 2], [440, 2], [392, 1], [494, 1], [440, 1], [440, 1], [392, 4]];
  let t = 0; const q = 0.44;
  for (let r = 0; r < 2; r++) N.forEach(([f, d]) => { tone(f, d * q * 0.95 + 0.3, "triangle", 0.15, null, t, lull); tone(f * 2, 0.6, "sine", 0.05, null, t, lull); t += d * q; });

}

    this.st[i] = 2; setEyes(i, "closed"); render(); SFX.kiss();
    const bl = $("bl" + i); if (bl) tween(500, k => bl.setAttribute("transform", `translate(0 ${110 * (1 - ease(k))})`));
    [523, 440, 392].forEach((f, n) => tone(f, 0.5, "triangle", 0.1, null, 0.15 + n * 0.25));
    const L = this.L(); sparkAt(L.x[i], L.cb - 300 * L.cs, "💗");
    if (this.st.every(v => v === 2)) after(900, () => { if (!this.music) this.hint(); });
  },
  hint() {
    const L = this.L();
    if (this.end) { glowAt(W / 2, H * 0.36, 160); return; }
    if (this.music) return;
    const i = this.st.findIndex(v => v < 2);
    if (i < 0) { glowAt(L.mob[0], L.mob[1] + 60, 160); return; }
    if (this.st[i] === 0) glowAt(L.x[i], L.mat - 190 * L.ms, 130);
    else glowAt(L.x[i], L.cb - 200 * L.cs, 170 * L.cs);
  }
};
// cradles of sleeping babies rock gently, the mobile sways with the music
ticks.push(() => {
  if (sid !== "nap") return;
  const N = SC.nap;
  for (let i = 0; i < 4; i++) { const el = $("cr" + i); if (el && N.st[i] === 2) el.setAttribute("transform", `rotate(${Math.sin(now / 650 + i) * 3} 0 -20)`); }
  if (N.music) { const m = $("mob"), L = N.L(); if (m) m.setAttribute("transform", `translate(${L.mob[0] + Math.sin(now / 500) * 16} ${L.mob[1]})`); }
});

measure(); go("board");
window.onStart = () => { started = true; idle = 0; };
addEventListener("resize", () => { const p = innerHeight > innerWidth; if (p !== PORT) { measure(); if (scene) { render(); setActs(); } } });
// test hook: step the clock, tap an element by its data-k / data-i
window.__game = {
  step(ms) { for (let t = 0; t < ms; t += 16) tick(16); },
  mem, go, scene: () => sid, sc: () => scene, SC,
  tap(k, i = 0) {
    const el = document.querySelector(`#sv [data-k="${k}"][data-i="${i}"]`); if (!el) return false;
    const r = el.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2, o = { bubbles: true, clientX: x, clientY: y, pointerId: 7, isPrimary: true };
    el.dispatchEvent(new PointerEvent("pointerdown", o)); dispatchEvent(new PointerEvent("pointerup", o)); return true;
  }
};
</script>
<script id="fullscreen">/* Games always play fullscreen. A browser only allows it on a tap or a click, so it is asked on the first one (the big play button) and again if fullscreen was left. */
(function () {
  function go() {
    var d = document, e = d.documentElement;
    if (d.fullscreenElement || d.webkitFullscreenElement) return;
    var f = e.requestFullscreen || e.webkitRequestFullscreen;
    if (!f) return;
    try { var p = f.call(e, { navigationUI: "hide" }); if (p && p.catch) p.catch(function () {}); } catch (_) {}
  }
  ["pointerdown", "pointerup", "keydown"].forEach(function (t) { addEventListener(t, go, true); });
})();
</script>
