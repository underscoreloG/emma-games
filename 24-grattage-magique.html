<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
:root{--bs:min(max(9vmin,72px),84px);--ink:#2b2d42;--bg:#e8f0ff;--accent:#3a86ff}
html,body{width:100%;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg)}
.emo{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;line-height:1}
#start{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;gap:5vmin;align-items:center;justify-content:center;background:#bde0fe}
#start .deco{font-size:18vmin}
#start .play{width:34vmin;height:34vmin;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 1.5vmin 0 rgba(0,0,0,.15);animation:pulse 1.4s ease-in-out infinite}
#start .play svg{width:50%;height:50%;margin-left:8%;fill:var(--accent)}
@keyframes pulse{50%{transform:scale(1.08)}}
#sortie{position:fixed;top:max(10px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));width:var(--bs);height:var(--bs);border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 2px 6px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;z-index:200}
#sortie svg{width:60%;height:60%}
#sortie:active{transform:scale(.9)}
/* Blue square with 4 white squares: back to the inner list */
.gb{position:fixed;top:max(10px,env(safe-area-inset-top));left:calc(max(10px,env(safe-area-inset-left)) + var(--bs) + 10px);width:var(--bs);height:var(--bs);border-radius:18px;border:0;background:#a0c4ff;display:none;grid-template-columns:1fr 1fr;gap:calc(var(--bs)*.07);padding:calc(var(--bs)*.2);box-shadow:0 5px 0 rgba(0,0,0,.15);z-index:40}
.gb i{background:#fff;border-radius:18%}
.gb:active,.act:active{transform:scale(.9)}
#app{position:fixed;inset:0;display:flex;flex-direction:row;padding:2vmin;gap:2vmin}
#board{flex:1;min-width:0;min-height:0;position:relative;background:#fff;border-radius:3vmin;box-shadow:0 1.2vmin 0 rgba(0,0,0,.08);overflow:hidden}
#pic{position:absolute;left:2%;right:2%;bottom:2%;top:calc(var(--bs) + 14px)}
#pic svg,.thumb svg,.thumb img{width:100%;height:100%;display:block}
#acts{position:absolute;top:max(10px,calc(env(safe-area-inset-top) - 2vmin));right:12px;display:flex;gap:10px;z-index:5}
.act{width:var(--bs);height:var(--bs);border:0;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:calc(var(--bs)*.52);box-shadow:0 5px 0 rgba(0,0,0,.15);background:#cdb4db;position:relative;overflow:hidden}
.act.y{background:#ffe066}.act svg{width:58%;height:58%}
/* Hold button: must be kept pressed, a stray tap does nothing */
.act.holdb::before{content:"";position:absolute;inset:0;background:#ef476f;transform:scaleY(0);transform-origin:bottom}
.act.holdb.hold::before{transform:scaleY(1);transition:transform .9s linear}
.act.holdb span{position:relative}
#pal{--ps:min(max(10vmin,76px),calc(86vh / var(--rows,7)));display:grid;grid-template-columns:repeat(3,var(--ps));grid-auto-rows:var(--ps);gap:1.1vh;align-content:center}
.sw{border-radius:50%;border:.7vmin solid #fff;box-shadow:0 .7vmin 0 rgba(0,0,0,.18);transition:transform .15s}
.sw.light{border-color:#ced4da}
.sw.rainbow{background:conic-gradient(#ef233c,#fb8500,#ffd60a,#38b000,#3a86ff,#8338ec,#ff70a6,#ef233c)}
.tp{border-radius:26%;background:#fff;box-shadow:0 .7vmin 0 rgba(0,0,0,.12);display:flex;align-items:center;justify-content:center;font-size:calc(var(--ps)*.56);transition:transform .15s}
.tp svg{width:78%;height:78%}
.sel{transform:scale(1.14);box-shadow:0 0 0 .9vmin var(--ink),0 .7vmin 0 rgba(0,0,0,.18)}
.r{stroke:var(--ink);stroke-width:5;stroke-linejoin:round;stroke-linecap:round;transition:fill .25s}
.d{pointer-events:none}
#gallery{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;align-items:center;justify-content:center;padding-top:calc(var(--bs) + 10px)}
#gallery.open{display:flex;animation:fadein .25s ease-out}
@keyframes fadein{from{opacity:0}}
#thumbs{display:grid;grid-template-columns:repeat(var(--gc,3),1fr);gap:2.4vmin;width:min(94vw,calc((100vh - var(--bs) - 9vmin)*var(--gw,2)))}
.thumb{position:relative;aspect-ratio:4/3;background:#fff;border-radius:2.5vmin;padding:3%;box-shadow:0 .8vmin 0 rgba(0,0,0,.1)}
.thumb:active{transform:scale(.96)}
.thumb .r{stroke-width:7}
.thumb.done::after{content:"⭐";position:absolute;right:-1vmin;top:-1.5vmin;font-size:5vmin;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
@media (orientation:portrait){
  #app{flex-direction:column}
  #pal{--ps:min(calc(88vw / var(--pp,7)),13vmin);grid-template-columns:repeat(var(--pp,7),var(--ps));gap:1.3vw;justify-content:center}
  #thumbs{grid-template-columns:repeat(var(--gcp,2),1fr);width:min(94vw,calc((100vh - var(--bs) - 12vmin)*var(--gwp,.88)))}
}
.spark{position:fixed;font-size:7vmin;margin:-3.5vmin 0 0 -3.5vmin;pointer-events:none;animation:spark .9s ease-out forwards;z-index:60}
@keyframes spark{0%{transform:scale(0) rotate(0)}40%{transform:scale(1.3) rotate(90deg)}100%{transform:scale(0) rotate(180deg);opacity:0}}
@media (prefers-reduced-motion:reduce){#start .play{animation:none!important}.spark{animation-duration:.3s}}
:root{--gc:4;--gw:1.78;--gcp:3;--gwp:1}
#pic{display:flex;align-items:center;justify-content:center}
#frame{position:relative;aspect-ratio:4/3;width:min(100%,calc((100vh - var(--bs) - 14px - 8vmin)*1.333));border-radius:2vmin;overflow:hidden}
#scene,#cv{position:absolute;inset:0;width:100%;height:100%}
#scene svg{width:100%;height:100%;display:block}
</style>

<body>
<div id="app"><div id="board"><div id="pic"><div id="frame"><div id="scene"></div><canvas id="cv" width="800" height="600"></canvas></div></div><div id="acts"><button id="wipe" class="act emo" type="button" aria-label="Tout effacer" style="background:#ffc8dd">🧽</button></div></div></div>

<div id="start"><div class="deco emo">✨🖐️</div><div class="play"><svg viewBox="0 0 100 100"><polygon points="30,20 30,80 82,50"/></svg></div></div>

<script>
"use strict";
/* ===== Shared core: sound (no voice), game clock, list screen, saving ===== */
const $ = id => document.getElementById(id);
let ac = null, master = null;
function audio() {

    ac = new C(); master = ac.createGain(); master.gain.value = 0.8; master.connect(ac.destination);

function tone(f, d = 0.2, type = "sine", v = 0.25, f2 = null, delay = 0) {

function noise(d = 0.3, v = 0.3, freq = 800, delay = 0) {

const SFX = {
  pop: () => tone(480 + Math.random() * 260, 0.12, "sine", 0.3, 1200),
  plop: () => tone(330, 0.16, "sine", 0.35, 170),
  soft: () => tone(240, 0.1, "sine", 0.12, 200),
  click: () => tone(1400, 0.05, "square", 0.06),
  whoosh: () => noise(0.35, 0.2, 1800),
  crunch: () => { noise(0.09, 0.5, 2600); noise(0.12, 0.4, 1500, 0.1); tone(180, 0.08, "square", 0.08, 90); },
  snip: () => { noise(0.05, 0.4, 6000); tone(2400, 0.04, "square", 0.05, 1800); noise(0.05, 0.3, 5000, 0.08); },
  boing: () => { tone(160, 0.4, "sine", 0.3, 480); tone(170, 0.4, "triangle", 0.08, 520); },
  grow: () => tone(300, 0.25, "sine", 0.2, 700),
  giggle: () => [880, 988, 880, 1047, 1175].forEach((f, i) => tone(f, 0.11, "sine", 0.14, f * 0.9, i * 0.09)),
  chime: () => [784, 988, 1175, 1568].forEach((f, i) => tone(f, 0.6, "triangle", 0.14, null, i * 0.08)),
  tada: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, i === 3 ? 0.9 : 0.25, "triangle", 0.2, null, i * 0.12)),

// Game clock: timers and tweens run on it, so the game can be stepped when requestAnimationFrame is throttled

const calm = !!(window.matchMedia && matchMedia("(prefers-reduced-motion:reduce)").matches);

// Game movements always play, even when the device asks for reduced motion: skipping them made jumps and falls look broken.
// Reduced motion only calms the decorative looping animations (CSS).

function tick(dt) {

  ticks.forEach(f => f(dt));

let lastT = 0;
function frame(t) { tick(Math.min(50, lastT ? t - lastT : 16)); lastT = t; requestAnimationFrame(frame); }
requestAnimationFrame(frame);
function spark(x, y, e) {

  s.style.left = x + "px"; s.style.top = y + "px"; document.body.appendChild(s); setTimeout(() => s.remove(), 950);
}
function burst() {
  SFX.tada(); const x = innerWidth / 2, y = innerHeight / 2;
  spark(x, y, "⭐"); spark(x - innerWidth * .2, y - innerHeight * .15); spark(x + innerWidth * .2, y - innerHeight * .1); spark(x, y + innerHeight * .2);
}
function load(key, def) { try { const m = JSON.parse(localStorage.getItem(key)); if (m && typeof m === "object") return m; } catch (_) {} return def; }

const popAt = k => k < 0.6 ? 0.3 + k / 0.6 * 0.9 : 1.2 - (k - 0.6) / 0.4 * 0.2;
const hopAt = k => Math.sin(k * Math.PI);
const rand = n => Math.floor(Math.random() * n);
function scenePt(svg, cx, cy) { const m = svg.getScreenCTM(); return m ? [(cx - m.e) / m.a, (cy - m.f) / m.d] : [0, 0]; }
function screenPt(svg, x, y) { const m = svg.getScreenCTM(); return m ? [m.a * x + m.e, m.d * y + m.f] : [innerWidth / 2, innerHeight / 2]; }
// Inner list: a full screen of thumbnails, opened by the blue 4-square button
const gallery = {
  o: null, isOpen: false,
  setup(o) {
    this.o = o;
    $("thumbs").addEventListener("pointerdown", e => { const el = e.target.closest(".thumb"); if (el) this.pick(+el.dataset.i); });
    $("gridBtn").addEventListener("pointerdown", () => this.show());
    this.show(true);
  },
  pick(i) { this.hide(); SFX.whoosh(); this.o.open(i); },
  show(quiet) {
    const o = this.o; if (o.leave && !quiet) o.leave();
    let h = "";
    for (let i = 0; i < o.n; i++) h += `<div class="thumb${o.done && o.done(i) ? " done" : ""}" data-i="${i}">${o.thumb(i)}</div>`;
    $("thumbs").innerHTML = h; $("gallery").classList.add("open"); $("gridBtn").style.display = "none"; this.isOpen = true;
    if (!quiet) SFX.back();
  },
  hide() { $("gallery").classList.remove("open"); $("gridBtn").style.display = "grid"; this.isOpen = false; }

// A button that must be held (about 1 s) before it acts
function holdButton(el, fn) {
  let t = null;
  const stop = () => { clearTimeout(t); t = null; el.classList.remove("hold"); };
  el.addEventListener("pointerdown", () => { el.classList.add("hold"); SFX.soft(); t = setTimeout(() => { stop(); fn(); }, 900); });
  ["pointerup", "pointerleave", "pointercancel"].forEach(n => el.addEventListener(n, stop));
}
$("start").addEventListener("pointerdown", () => { audio(); $("start").style.display = "none"; SFX.chime(); if (window.onStart) window.onStart(); });
addEventListener("pointerdown", audio);
["contextmenu", "gesturestart", "dblclick", "selectstart", "dragstart"].forEach(t => addEventListener(t, e => e.preventDefault()));
addEventListener("touchmove", e => e.preventDefault(), { passive: false });
window.__game = { step(ms) { for (let t = 0; t < ms; t += 16) tick(16); }, gallery };
/* ===== Picture library: scenes made of big emoji on a coloured sky (800x600) ===== */
const SCENES = [
  { a: "#ffe29a", b: "#ffb86b", g: "#e0a458", it: [["🌞", 680, 110, 120], ["🌴", 120, 330, 210], ["🦒", 650, 370, 190], ["🦁", 390, 380, 230]] },
  { a: "#8fd3f4", b: "#2a7fba", g: "#f1dca7", it: [["🐟", 620, 170, 80], ["🐳", 390, 290, 260], ["🐠", 150, 430, 90], ["🐙", 660, 450, 120], ["🐚", 130, 545, 70]] },
  { a: "#2b2d6e", b: "#0b1033", it: [["⭐", 120, 120, 70], ["⭐", 190, 470, 50], ["🌙", 660, 120, 120], ["🛸", 130, 300, 110], ["👽", 650, 450, 100], ["🚀", 400, 300, 240]] },
  { a: "#bde0fe", b: "#e0f4ff", g: "#8bd17c", it: [["🌞", 680, 100, 110], ["🌻", 90, 430, 120], ["🐮", 280, 400, 200], ["🐷", 540, 430, 160], ["🐔", 700, 480, 90]] },
  { a: "#caf0f8", b: "#e8fbff", g: "#95d5b2", it: [["🌈", 400, 190, 300], ["🦋", 230, 300, 120], ["🐝", 600, 300, 80], ["🌷", 120, 470, 130], ["🐞", 520, 480, 110], ["🌼", 700, 480, 100]] },
  { a: "#ffd6ff", b: "#c8b6ff", it: [["☁️", 140, 120, 130], ["🌟", 660, 130, 90], ["💖", 120, 460, 90], ["🍭", 690, 460, 110], ["🦄", 400, 330, 280]] },
  { a: "#d8f3dc", b: "#b7e4c7", g: "#74c69d", it: [["🌋", 670, 190, 170], ["🌴", 90, 390, 170], ["🦕", 310, 340, 260], ["🦖", 610, 420, 170], ["🥚", 450, 530, 70]] },
  { a: "#e0fbfc", b: "#a9def9", g: "#ffffff", it: [["❄️", 120, 120, 80], ["❄️", 680, 150, 70], ["⛄", 660, 400, 160], ["🐧", 300, 400, 210], ["🐧", 470, 460, 110], ["🐟", 150, 540, 60]] },
  { a: "#e9f5db", b: "#cfe1b9", g: "#87986a", it: [["🌲", 110, 320, 230], ["🌲", 700, 340, 200], ["🦉", 560, 200, 120], ["🦊", 310, 420, 180], ["🍄", 480, 510, 80], ["🐿️", 620, 460, 110]] },
  { a: "#bde0fe", b: "#e9f5ff", g: "#adb5bd", it: [["☁️", 160, 120, 120], ["🚁", 600, 160, 150], ["🚒", 260, 410, 230], ["🚌", 570, 430, 190]] },
  { a: "#fff1b8", b: "#ffd6e0", it: [["🎈", 140, 210, 150], ["🎈", 660, 230, 130], ["🎂", 400, 390, 250], ["🎁", 150, 480, 120], ["🎉", 650, 470, 120]] },
  { a: "#b7e4c7", b: "#95d5b2", g: "#52b788", it: [["🦜", 130, 150, 110], ["🐒", 610, 230, 140], ["🐘", 290, 380, 240], ["🐯", 600, 450, 170], ["🌺", 100, 510, 80]] }
];
function sceneInner(i) {
  const s = SCENES[i];
  return `<defs><linearGradient id="sg${i}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${s.a}"/><stop offset="1" stop-color="${s.b}"/></linearGradient></defs><rect width="800" height="600" fill="url(#sg${i})"/>` +
    (s.g ? `<path d="M0 480Q400 430 800 480V600H0Z" fill="${s.g}"/>` : "") +
    s.it.map((t, k) => `<text class="emo" data-k="${k}" x="${t[1]}" y="${t[2] + t[3] * 0.36}" font-size="${t[3]}" text-anchor="middle">${t[0]}</text>`).join("");
}
const sceneSVG = i => `<svg viewBox="0 0 800 600">${sceneInner(i)}</svg>`;
/* ===== The game ===== */
// Rub the grey page (a finger, or just moving the mouse) and the picture appears.
const KEY = "grattage-v1", mem = load(KEY, { done: [] });
if (!Array.isArray(mem.done)) mem.done = [];
const GX = 16, GY = 12, cv = $("cv"), g2 = cv.getContext("2d"), last = new Map();
let cur = -1, cells = null, cleared = 0, finished = false, lastS = -999;
function cover() {
  g2.globalCompositeOperation = "source-over"; g2.fillStyle = "#b9bdc9"; g2.fillRect(0, 0, 800, 600);

  cells = new Uint8Array(GX * GY); cleared = 0; finished = false;
  cv.style.opacity = 1; cv.style.display = "";
}
function open(i) { cur = i; clearClock(); last.clear(); $("scene").innerHTML = sceneSVG(i); cover(); }
function scratch(x, y) {
  if (finished || cur < 0) return;
  g2.globalCompositeOperation = "destination-out"; g2.beginPath(); g2.arc(x, y, 60, 0, 7); g2.fill();
  const cw = 800 / GX, ch = 600 / GY;
  for (let gy = Math.max(0, Math.floor((y - 58) / ch)); gy <= Math.min(GY - 1, Math.floor((y + 58) / ch)); gy++)
    for (let gx = Math.max(0, Math.floor((x - 58) / cw)); gx <= Math.min(GX - 1, Math.floor((x + 58) / cw)); gx++) {
      const k = gy * GX + gx;

function line(a, b) {
  const n = Math.max(1, Math.ceil(Math.hypot(b[0] - a[0], b[1] - a[1]) / 28));

function hop(t) { tween(450, k => t.setAttribute("transform", `translate(0 ${(-40 * hopAt(k)).toFixed(1)})`)); }
// Enough is uncovered: the rest of the grey fades away and the picture comes alive

  tween(500, k => { cv.style.opacity = 1 - k; }, () => { cv.style.display = "none"; });
