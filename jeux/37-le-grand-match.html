html,body{width:100%;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--grass)}

<body>

<div id="start"><svg class="deco" viewBox="-48 -48 96 96"><use href="#ballArt"/></svg><div class="ttl">Le grand match</div><div class="play"><svg viewBox="0 0 100 100"><polygon points="30,20 30,80 82,50"/></svg></div></div>

<script>
"use strict";
/* ===== Shared core: sound (no voice), game clock, saving ===== */
const $ = id => document.getElementById(id);
let ac = null, master = null;
function audio() {
  if (!ac) {
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    ac = new C(); master = ac.createGain(); master.gain.value = 0.8; master.connect(ac.destination);
  }
  if (ac.state === "suspended") ac.resume();
}
function tone(f, d = 0.2, type = "sine", v = 0.25, f2 = null, delay = 0) {
  if (!ac) return;
  const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(v, t + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + d + 0.05);
}
function noise(d = 0.3, v = 0.3, freq = 800, delay = 0) {
  if (!ac) return;
  const n = Math.floor(ac.sampleRate * d), b = ac.createBuffer(1, n, ac.sampleRate), data = b.getChannelData(0);
  for (let i = 0; i < n; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2);
  const s = ac.createBufferSource(), fl = ac.createBiquadFilter(), g = ac.createGain();
  s.buffer = b; fl.type = "lowpass"; fl.frequency.value = freq; g.gain.value = v;
  s.connect(fl); fl.connect(g); g.connect(master); s.start(ac.currentTime + delay);
}
// Game clock: timers and tweens run on it, so the game can be stepped when requestAnimationFrame is throttled
let now = 0, timers = [], tweens = [];
const ticks = [];
const calm = !!(window.matchMedia && matchMedia("(prefers-reduced-motion:reduce)").matches);
function after(ms, fn) { timers.push({ at: now + ms, fn }); }
// Game movements always play, even when the device asks for reduced motion: skipping them made jumps and falls look broken.
// Reduced motion only calms the decorative looping animations.
function tween(ms, fn, done) { tweens.push({ t0: now, ms, fn, done }); fn(0); }
function clearClock() { timers = []; tweens = []; }
function tick(dt) {
  now += dt;
  const due = timers.filter(t => t.at <= now); timers = timers.filter(t => t.at > now); due.forEach(t => t.fn());
  // tweens started by a finishing tween (chained moves) are kept: they land in the fresh list
  const running = tweens; tweens = [];
  const left = running.filter(w => { const k = Math.min(1, (now - w.t0) / w.ms); w.fn(k); if (k >= 1 && w.done) w.done(); return k < 1; });
  tweens = left.concat(tweens);
  ticks.forEach(f => f(dt));
}
let lastT = 0;
function frame(t) { tick(Math.min(50, lastT ? t - lastT : 16)); lastT = t; requestAnimationFrame(frame); }
requestAnimationFrame(frame);
function spark(x, y, e) {
  const s = document.createElement("div"); s.className = "spark emo"; s.textContent = e || "✨";
  s.style.left = x + "px"; s.style.top = y + "px"; document.body.appendChild(s); setTimeout(() => s.remove(), 950);
}
function load(key, def) { try { const m = JSON.parse(localStorage.getItem(key)); if (m && typeof m === "object") return m; } catch (_) {} return def; }
function store(key, o) { try { localStorage.setItem(key, JSON.stringify(o)); } catch (_) {} }
const rand = n => Math.floor(Math.random() * n);
function scenePt(svg, cx, cy) { const m = svg.getScreenCTM(); return m ? [(cx - m.e) / m.a, (cy - m.f) / m.d] : [0, 0]; }
function screenPt(svg, x, y) { const m = svg.getScreenCTM(); return m ? [m.a * x + m.e, m.d * y + m.f] : [innerWidth / 2, innerHeight / 2]; }
$("start").addEventListener("pointerdown", () => { audio(); $("start").style.display = "none"; SFX.chime(); if (window.onStart) window.onStart(); });
addEventListener("pointerdown", audio);
["contextmenu", "gesturestart", "dblclick", "selectstart", "dragstart"].forEach(t => addEventListener(t, e => e.preventDefault()));
addEventListener("touchmove", e => e.preventDefault(), { passive: false });
window.__game = { step(ms) { for (let t = 0; t < ms; t += 16) tick(16); } };

/* ===== The match: content tables ===== */
const MATCH = [
  { k: "pass", passes: 2 },
  { k: "penalty" },
  { k: "save", saves: 3, then: { k: "pass", passes: 1 } },
  { k: "pass", passes: 3, fork: true },
  { k: "penalty" }
];
const SHIRTS = [
  { id: "bleu", kit: "#2f6fde", opp: "#fb8500" },
  { id: "rouge", kit: "#e63946", opp: "#48cae4" },
  { id: "rose", kit: "#ff70a6", opp: "#7b2cbf" },
  { id: "jaune", kit: "#ffd60a", opp: "#1d3557" }
];
const INK = "#2b2d42", KEEPER = "#b5e48c", PITCH = ["#6fbf73", "#62b268"], GOLD = ["#ffd60a", "#f4a800", "#fff3b0"];
const SKIN = ["#ffdcc2", "#eebb92", "#bb7d52", "#7d4e32"];
const TEAM = [   // the hero first, then her team: two boys and two girls
  { skin: SKIN[0], hair: "#7a4a24", style: "pony", num: 10, name: "EMMA" },
  { skin: SKIN[3], hair: "#1f1a1c", style: "curl", num: 7 },
  { skin: SKIN[2], hair: "#2a1c12", style: "buns", num: 5 },
  { skin: SKIN[0], hair: "#d9a441", style: "bob", num: 9 },
  { skin: SKIN[1], hair: "#a5502a", style: "short", num: 3 }
];
const OPPS = [{ skin: SKIN[1], hair: "#3a2a1c", style: "short", num: 4 }, { skin: SKIN[3], hair: "#1f1a1c", style: "curl", num: 8 }, { skin: SKIN[0], hair: "#c98a2e", style: "tuft", num: 6 }];
const REST = { j: 0, r: 0, sq: 1, fx: 1, hr: 0, hy: 0, aL: 10, aR: 10, asL: 1, asR: 1, lL: 0, lR: 0, lsL: 1, lsR: 1, eye: 1, lx: 0, ly: 0 };
const MOOD = {   // mouth, filled or not, brows, other eyes (arc = closed happy, shut = asleep, x = knocked out)
  smile: { m: "M-22 -198Q0 -172 22 -198", b: "M-44 -274Q-30 -282 -16 -274M16 -274Q30 -282 44 -274" },
  open: { m: "M-30 -204Q0 -198 30 -204Q26 -156 0 -156Q-26 -156 -30 -204Z", f: 1, b: "M-44 -282Q-30 -292 -16 -282M16 -282Q30 -292 44 -282" },
  joy: { m: "M-32 -206Q0 -200 32 -206Q28 -152 0 -152Q-28 -152 -32 -206Z", f: 1, b: "M-44 -286Q-30 -296 -16 -286M16 -286Q30 -296 44 -286", e: "arc" },
  oh: { m: "M-12 -188a12 16 0 1 0 24 0a12 16 0 1 0 -24 0Z", f: 1, b: "M-46 -288Q-30 -298 -14 -288M14 -288Q30 -298 46 -288" },
  sad: { m: "M-20 -176Q0 -200 20 -176", b: "M-46 -268L-16 -280M16 -280L46 -268" },
  worry: { m: "M-24 -184q8 -8 16 0t16 0t16 0", b: "M-46 -272L-16 -284M16 -284L46 -272" },
  dizzy: { m: "M-28 -186q9 -12 18 0t18 0t18 0", b: "M-46 -282Q-30 -272 -16 -282M16 -272Q30 -284 46 -276", e: "x" },
  sleep: { m: "M-9 -190Q0 -182 9 -190", b: "M-44 -264Q-30 -268 -16 -264M16 -264Q30 -268 44 -264", e: "shut" }
};
const POSE = {
  stand: { ...REST },
  ready: { ...REST, sq: 0.95, lL: 14, lR: 14, aL: 52, aR: 52 },
  windup: { r: -12, sq: 0.9, aL: 60, aR: -50, lL: 8, lR: -62 },
  strike: { r: 12, sq: 1.05, j: -16, aL: -40, aR: 60, lL: -6, lR: 88 },
  sit: { j: 44, sq: 0.84, lL: 74, lR: 74, lsL: 0.92, lsR: 0.92, aL: 26, aR: 26, r: 0 }
};
const EXPR = ["plonge", "glisse", "tourne", "tunnel"];   // besides these, "poteau" comes up about 1 shot in 4 (1 in 3, never twice in a row)
const EASE = {
  line: k => k, io: k => k < 0.5 ? 2 * k * k : 1 - 2 * (1 - k) * (1 - k), out: k => 1 - (1 - k) * (1 - k), in: k => k * k,
  back: k => { const u = k - 1; return 1 + 2.7 * u * u * u + 1.7 * u * u; },
  elastic: k => k >= 1 ? 1 : 1 - Math.pow(2, -9 * k) * Math.cos(k * 15)
};

/* ===== Layout ===== */
const svg = $("svg"), NS = "http://www.w3.org/2000/svg", KEY = "match-v1";
const mem = load(KEY, { trophies: 0, shirt: null });
if (typeof mem.trophies !== "number") mem.trophies = 0;
let VW = 1600, VH = 900, PX = 1, PORT = false, Z = 1, HZ = 400, K = null, scene = null, rigs = [];
const G = {
  screen: "start", stepIndex: 0, goals: 0, waiting: false, busy: false, hint: false, shirt: mem.shirt, lastGag: null, lastCeleb: null,
  party: false, act: null, target: null, waitMs: 0, step: null, celebs: [], force: { gag: null, celeb: null }, nk: 0, lampsOff: 0, wave: -1, cheer: 0
};
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const n1 = v => Math.round(v * 10) / 10, n3 = v => Math.round(v * 1000) / 1000;
const T = (e, s) => { if (e && e._t !== s) { e.setAttribute("transform", s); e._t = s; } };
function el(parent, html) { const g = document.createElementNS(NS, "g"); g.innerHTML = html; parent.appendChild(g); return g; }
function tint(hex, f) {   // f > 0 lightens, f < 0 darkens
  const n = parseInt(hex.slice(1), 16), t = f < 0 ? 0 : 255, a = Math.abs(f), c = v => Math.round(v + (t - v) * a);
  return `rgb(${c(n >> 16)},${c(n >> 8 & 255)},${c(n & 255)})`;
}
const textOn = hex => { const n = parseInt(hex.slice(1), 16); return (n >> 16) * 0.3 + (n >> 8 & 255) * 0.59 + (n & 255) * 0.11 > 165 ? INK : "#fff"; };
function fit() {
  const w = innerWidth, h = innerHeight, ra = w / h;
  PORT = ra < 1;
  if (PORT) { VW = 1000; VH = Math.round(1000 / ra); } else if (ra > 16 / 9) { VH = 900; VW = Math.round(900 * ra); } else { VW = 1600; VH = Math.round(1600 / ra); }
  svg.setAttribute("viewBox", `0 0 ${VW} ${VH}`); PX = w / VW;
  HZ = Math.round(VH * (PORT ? 0.4 : 0.44));
  Z = PORT ? 1.25 : clamp(VH / 900, 1, 1.3) * (PX < 0.6 ? 1.15 : 1);
  sizeFx();
  if (scene) { scene.bg(); if (scene.place) scene.place(); }
}
addEventListener("resize", fit);
const standTop = () => Math.round(VH * (PORT ? 0.17 : 0.13));
const footR = () => Math.max(44, 37 / (PX * Z));   // the ball stays at least 74 px on screen
const shotR = () => Math.max(58, 37 / PX);

/* ===== Art: defs, sky, stands, grass, goal ===== */
function pent(cx, cy, r, rot) {
  let p = "";
  for (let i = 0; i < 5; i++) { const a = rot + i * 1.2566; p += `${(cx + r * Math.sin(a)).toFixed(1)},${(cy - r * Math.cos(a)).toFixed(1)} `; }
  return `<polygon points="${p}"/>`;
}
function ballDef() {
  let rim = "", spokes = "";
  for (let i = 0; i < 5; i++) {
    const a = i * 1.2566, s = Math.sin(a), c = Math.cos(a);
    rim += pent(40 * s, -40 * c, 14, a + 0.63);
    spokes += `M${(14 * s).toFixed(1)} ${(-14 * c).toFixed(1)}L${(27 * s).toFixed(1)} ${(-27 * c).toFixed(1)}`;
  }
  return `<clipPath id="ballClip"><circle r="44"/></clipPath><g id="ballArt"><circle r="44" fill="#fff"/><g clip-path="url(#ballClip)" fill="${INK}">${pent(0, 0, 15, 0)}${rim}<path d="${spokes}" stroke="${INK}" stroke-width="3" fill="none"/></g><circle r="44" fill="none" stroke="${INK}" stroke-width="5"/></g>`;
}
function cupDef() {
  return `<g id="cupArt"><rect x="-74" y="-44" width="148" height="44" rx="10" fill="#8a5a2b" stroke="${INK}" stroke-width="6"/><rect x="-46" y="-72" width="92" height="30" rx="8" fill="${GOLD[1]}" stroke="${INK}" stroke-width="6"/>` +
    `<path d="M-90 -290C-178 -300 -172 -176 -60 -170M90 -290C178 -300 172 -176 60 -170" fill="none" stroke="${INK}" stroke-width="28" stroke-linecap="round"/><path d="M-90 -290C-178 -300 -172 -176 -60 -170M90 -290C178 -300 172 -176 60 -170" fill="none" stroke="${GOLD[0]}" stroke-width="16" stroke-linecap="round"/>` +
    `<path d="M-100 -320H100Q104 -176 24 -132L16 -72H-16L-24 -132Q-104 -176 -100 -320Z" fill="${GOLD[0]}" stroke="${INK}" stroke-width="6" stroke-linejoin="round"/><path d="M-72 -300Q-70 -210 -30 -160" fill="none" stroke="${GOLD[2]}" stroke-width="16" stroke-linecap="round"/><path d="M58 -310Q60 -230 30 -166Q84 -210 84 -310Z" fill="${GOLD[1]}"/>` +
    `<path d="M0 -270l13 28l30 3l-23 20l7 30l-27 -15l-27 15l7 -30l-23 -20l30 -3Z" fill="#fff" stroke="${INK}" stroke-width="4" stroke-linejoin="round"/></g>`;
}
const SEC = 368, TILE_H = 264;   // one stand section is one tile wide
function crowdDefs() {
  const c = K ? [K.kit, K.kit, K.kit, K.kit, K.kit, tint(K.kit, 0.25), K.kit, "#fff", K.opp] : SHIRTS.map(s => s.kit).concat("#fff");
  let out = "";
  for (let t = 0; t < 3; t++) {
    const rows = [0, 1, 2, 3, 4, 5].map(() => [0, 1, 2, 3, 4, 5, 6, 7].map(() => ({ dx: rand(5) - 2, dy: rand(5) - 2, col: c[rand(c.length)], sk: SKIN[rand(4)], hat: rand(5) < 2 })));
    let f = "";
    for (let row = -1; row < 7; row++) for (let i = -1; i < 9; i++) {   // one extra ring of fans so the tile joins without a seam
      const q = rows[(row + 6) % 6][(i + 8) % 8], x = i * 46 + (row & 1 ? 23 : 0) + q.dx, y = row * 44 + 16 + q.dy;
      f += `<ellipse cx="${x}" cy="${y + 28}" rx="21" ry="19" fill="${q.col}"/><circle cx="${x}" cy="${y}" r="15" fill="${q.sk}"/>`;
      if (q.hat) f += `<path d="M${x - 16} ${y - 2}a16 16 0 0 1 32 0Z" fill="${q.col}"/>`;
    }
    out += `<pattern id="cr${t}" patternUnits="userSpaceOnUse" width="${SEC}" height="${TILE_H}"><rect width="${SEC}" height="${TILE_H}" fill="#39466b"/>${f}</pattern>`;
  }
  return out;
}
function buildDefs() {
  $("defs").innerHTML = ballDef() + cupDef() + crowdDefs() +
    `<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7cc4f5"/><stop offset="1" stop-color="#d8f1ff"/></linearGradient>` +
    `<radialGradient id="glowG"><stop offset="0" stop-color="#fff7b0" stop-opacity=".95"/><stop offset=".55" stop-color="#ffe066" stop-opacity=".6"/><stop offset="1" stop-color="#ffe066" stop-opacity="0"/></radialGradient>` +
    `<pattern id="seats" patternUnits="userSpaceOnUse" width="46" height="44"><rect width="46" height="44" fill="#2b3556"/><rect x="5" y="10" width="36" height="24" rx="8" fill="#47547c"/></pattern>` +
    `<pattern id="grassV" patternUnits="userSpaceOnUse" width="480" height="20"><rect width="240" height="20" fill="${PITCH[0]}"/><rect x="240" width="240" height="20" fill="${PITCH[1]}"/></pattern>`;
}
const LAMPS = [.2, .38, .62, .8], lampY = () => Math.max(26, standTop() - (PORT ? 120 : 92));
function skyArt() {
  const top = standTop(), ly = lampY();
  let s = `<rect x="-60" y="-60" width="${VW + 120}" height="${VH + 120}" fill="url(#sky)"/>`;
  [[.16, .35, 130], [.55, .55, 170], [.84, .28, 110]].forEach(([fx, fy, w]) => {
    const x = VW * fx, y = top * fy + 14;
    s += `<g fill="#fff" opacity=".9"><ellipse cx="${x}" cy="${y}" rx="${w}" ry="${w * .26}"/><ellipse cx="${x - w * .3}" cy="${y - w * .12}" rx="${w * .42}" ry="${w * .26}"/><ellipse cx="${x + w * .28}" cy="${y - w * .16}" rx="${w * .5}" ry="${w * .32}"/></g>`;
  });
  LAMPS.forEach((fx, i) => {
    const x = VW * fx, off = i < G.lampsOff;
    s += `<rect x="${x - 7}" y="${ly + 40}" width="14" height="${top - ly}" fill="#7a869a"/><g data-lamp="${i}"><rect x="${x - 56}" y="${ly}" width="112" height="56" rx="10" fill="${off ? "#5c6680" : "#fff7cf"}" stroke="${INK}" stroke-width="5"/></g>`;
  });
  return s;
}
