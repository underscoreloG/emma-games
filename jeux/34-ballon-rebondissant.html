<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
:root{--bs:min(max(9vmin,72px),84px);--ink:#2b2d42;--bg:#e7f5ff;--accent:#3a86ff}
html,body{width:100%;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg)}
.emo{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;line-height:1}
#start{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;gap:5vmin;align-items:center;justify-content:center;background:#bde0fe}

#start .play{width:34vmin;height:34vmin;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 1.5vmin 0 rgba(0,0,0,.15);animation:pulse 1.4s ease-in-out infinite}

#sortie{position:fixed;top:max(10px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));width:var(--bs);height:var(--bs);border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 2px 6px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;z-index:200}

#sortie:active{transform:scale(.9)}

.gb{position:fixed;top:max(10px,env(safe-area-inset-top));left:calc(max(10px,env(safe-area-inset-left)) + var(--bs) + 10px);width:var(--bs);height:var(--bs);border-radius:18px;border:0;background:#a0c4ff;display:none;grid-template-columns:1fr 1fr;gap:calc(var(--bs)*.07);padding:calc(var(--bs)*.2);box-shadow:0 5px 0 rgba(0,0,0,.15);z-index:40}

.gb:active,.act:active{transform:scale(.9)}
#app{position:fixed;inset:0;display:flex;flex-direction:row;padding:2vmin;gap:2vmin}
#board{flex:1;min-width:0;min-height:0;position:relative;background:#fff;border-radius:3vmin;box-shadow:0 1.2vmin 0 rgba(0,0,0,.08);overflow:hidden}

.act.y{background:#ffe066}.act svg{width:58%;height:58%}

.act.holdb::before{content:"";position:absolute;inset:0;background:#ef476f;transform:scaleY(0);transform-origin:bottom}
.act.holdb.hold::before{transform:scaleY(1);transition:transform .9s linear}
.act.holdb span{position:relative}
#pal{--ps:min(max(10vmin,76px),calc(86vh / var(--rows,7)));display:grid;grid-template-columns:repeat(3,var(--ps));grid-auto-rows:var(--ps);gap:1.1vh;align-content:center}

.tp svg{width:78%;height:78%}
.sel{transform:scale(1.14);box-shadow:0 0 0 .9vmin var(--ink),0 .7vmin 0 rgba(0,0,0,.18)}
.r{stroke:var(--ink);stroke-width:5;stroke-linejoin:round;stroke-linecap:round;transition:fill .25s}
.d{pointer-events:none}
#gallery{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;align-items:center;justify-content:center;padding-top:calc(var(--bs) + 10px)}
#gallery.open{display:flex;animation:fadein .25s ease-out}
@keyframes fadein{from{opacity:0}}
#thumbs{display:grid;grid-template-columns:repeat(var(--gc,3),1fr);gap:2.4vmin;width:min(94vw,calc((100vh - var(--bs) - 9vmin)*var(--gw,2)))}
.thumb{position:relative;aspect-ratio:4/3;background:#fff;border-radius:2.5vmin;padding:3%;box-shadow:0 .8vmin 0 rgba(0,0,0,.1)}
.thumb:active{transform:scale(.96)}
.thumb .r{stroke-width:7}
.thumb.done::after{content:"⭐";position:absolute;right:-1vmin;top:-1.5vmin;font-size:5vmin;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
@media (orientation:portrait){
  #app{flex-direction:column}
  #pal{--ps:min(calc(88vw / var(--pp,7)),13vmin);grid-template-columns:repeat(var(--pp,7),var(--ps));gap:1.3vw;justify-content:center}
  #thumbs{grid-template-columns:repeat(var(--gcp,2),1fr);width:min(94vw,calc((100vh - var(--bs) - 12vmin)*var(--gwp,.88)))}
}
.spark{position:fixed;font-size:7vmin;margin:-3.5vmin 0 0 -3.5vmin;pointer-events:none;animation:spark .9s ease-out forwards;z-index:60}
@keyframes spark{0%{transform:scale(0) rotate(0)}40%{transform:scale(1.3) rotate(90deg)}100%{transform:scale(0) rotate(180deg);opacity:0}}

:root{--rows:5;--pp:5;--gc:3;--gw:2;--gcp:2;--gwp:.889}
#pic{inset:0;border-radius:3vmin;overflow:hidden}
#pic svg{overflow:visible}
.tp.sel{transform:scale(1.14)}
</style>

<script>
"use strict";
/* ===== Shared core: sound (no voice), game clock, list screen, saving ===== */
const $ = id => document.getElementById(id);
let ac = null, master = null;

const SFX = {
  pop: () => tone(480 + Math.random() * 260, 0.12, "sine", 0.3, 1200),
  plop: () => tone(330, 0.16, "sine", 0.35, 170),
  soft: () => tone(240, 0.1, "sine", 0.12, 200),
  click: () => tone(1400, 0.05, "square", 0.06),
  whoosh: () => noise(0.35, 0.2, 1800),
  crunch: () => { noise(0.09, 0.5, 2600); noise(0.12, 0.4, 1500, 0.1); tone(180, 0.08, "square", 0.08, 90); },
  snip: () => { noise(0.05, 0.4, 6000); tone(2400, 0.04, "square", 0.05, 1800); noise(0.05, 0.3, 5000, 0.08); },
  boing: () => { tone(160, 0.4, "sine", 0.3, 480); tone(170, 0.4, "triangle", 0.08, 520); },
  grow: () => tone(300, 0.25, "sine", 0.2, 700),
  giggle: () => [880, 988, 880, 1047, 1175].forEach((f, i) => tone(f, 0.11, "sine", 0.14, f * 0.9, i * 0.09)),
  chime: () => [784, 988, 1175, 1568].forEach((f, i) => tone(f, 0.6, "triangle", 0.14, null, i * 0.08)),
  tada: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, i === 3 ? 0.9 : 0.25, "triangle", 0.2, null, i * 0.12)),

// Game clock: timers and tweens run on it, so the game can be stepped when requestAnimationFrame is throttled

const ticks = [];
const calm = !!(window.matchMedia && matchMedia("(prefers-reduced-motion:reduce)").matches);
function after(ms, fn) { timers.push({ at: now + ms, fn }); }
// Game movements always play, even when the device asks for reduced motion: skipping them made jumps and falls look broken.
// Reduced motion only calms the decorative looping animations (CSS).
function tween(ms, fn, done) { tweens.push({ t0: now, ms, fn, done }); fn(0); }
function clearClock() { timers = []; tweens = []; }
function tick(dt) {
  now += dt;
  const due = timers.filter(t => t.at <= now); timers = timers.filter(t => t.at > now); due.forEach(t => t.fn());

  const running = tweens; tweens = [];
  const left = running.filter(w => { const k = Math.min(1, (now - w.t0) / w.ms); w.fn(k); if (k >= 1 && w.done) w.done(); return k < 1; });

  ticks.forEach(f => f(dt));

let lastT = 0;
function frame(t) { tick(Math.min(50, lastT ? t - lastT : 16)); lastT = t; requestAnimationFrame(frame); }
requestAnimationFrame(frame);
function spark(x, y, e) {

function burst() {
  SFX.tada(); const x = innerWidth / 2, y = innerHeight / 2;

function load(key, def) { try { const m = JSON.parse(localStorage.getItem(key)); if (m && typeof m === "object") return m; } catch (_) {} return def; }

const popAt = k => k < 0.6 ? 0.3 + k / 0.6 * 0.9 : 1.2 - (k - 0.6) / 0.4 * 0.2;
const hopAt = k => Math.sin(k * Math.PI);
const rand = n => Math.floor(Math.random() * n);
function scenePt(svg, cx, cy) { const m = svg.getScreenCTM(); return m ? [(cx - m.e) / m.a, (cy - m.f) / m.d] : [0, 0]; }
function screenPt(svg, x, y) { const m = svg.getScreenCTM(); return m ? [m.a * x + m.e, m.d * y + m.f] : [innerWidth / 2, innerHeight / 2]; }
// Inner list: a full screen of thumbnails, opened by the blue 4-square button
const gallery = {
  o: null, isOpen: false,
  setup(o) {
    this.o = o;
    $("thumbs").addEventListener("pointerdown", e => { const el = e.target.closest(".thumb"); if (el) this.pick(+el.dataset.i); });
    $("gridBtn").addEventListener("pointerdown", () => this.show());
    this.show(true);
  },
  pick(i) { this.hide(); SFX.whoosh(); this.o.open(i); },
  show(quiet) {

  hide() { $("gallery").classList.remove("open"); $("gridBtn").style.display = "grid"; this.isOpen = false; }

// A button that must be held (about 1 s) before it acts
function holdButton(el, fn) {
  let t = null;
  const stop = () => { clearTimeout(t); t = null; el.classList.remove("hold"); };
  el.addEventListener("pointerdown", () => { el.classList.add("hold"); SFX.soft(); t = setTimeout(() => { stop(); fn(); }, 900); });

}
$("start").addEventListener("pointerdown", () => { audio(); $("start").style.display = "none"; SFX.chime(); if (window.onStart) window.onStart(); });
addEventListener("pointerdown", audio);
["contextmenu", "gesturestart", "dblclick", "selectstart", "dragstart"].forEach(t => addEventListener(t, e => e.preventDefault()));
addEventListener("touchmove", e => e.preventDefault(), { passive: false });
window.__game = { step(ms) { for (let t = 0; t < ms; t += 16) tick(16); }, gallery };

/* ===== The game ===== */
// Tap anywhere: the ball rolls and bounces towards that spot. Tap the ball itself: a big jump.
// Each place has its own little goal: skittles, a football goal, stars, bells, a hole, apples.
const KEY = "ballon-v1", mem = load(KEY, { done: [], ball: 0 });
if (!Array.isArray(mem.done)) mem.done = [];
const BALLS = [{ e: "⚽", r: 55, g: 1500, b: 0.72 }, { e: "🏀", r: 58, g: 1500, b: 0.8 }, { e: "🏐", r: 55, g: 1450, b: 0.7 }, { e: "🎾", r: 40, g: 1500, b: 0.82 }, { e: "🎈", r: 62, g: 260, b: 0.45, air: 1.2 }];
if (!(mem.ball >= 0 && mem.ball < BALLS.length)) mem.ball = 0;
// ground made of straight pieces between points
const line = pts => x => { for (let i = 1; i < pts.length; i++) if (x <= pts[i][0]) { const a = pts[i - 1], b = pts[i]; return a[1] + (b[1] - a[1]) * (x - a[0]) / (b[0] - a[0]); } return pts[pts.length - 1][1]; };
const hPipe = x => 820 - 520 * Math.pow((x - 800) / 800, 2);
const hTrack = line([[0, 380], [480, 720], [600, 650], [640, 650], [700, 770], [1290, 770], [1300, 1100], [1460, 1100], [1470, 770], [1600, 770]]);
const hBumps = x => 640 + 120 * Math.sin(x / 110);
const PLACES = [
  { sky: ["#bde0fe", "#eef8ff"], grass: "#8bd17c", kind: "pins", start: 800, H: x => 770 - (x > 450 && x < 850 ? 45 * Math.sin((x - 450) / 400 * Math.PI) : 0),
    deco: [["🌞", 1450, 130, 130], ["☁️", 300, 140, 120], ["🌳", 150, 600, 260]] },
  { sky: ["#ffe5b4", "#fff6e8"], grass: "#95d5b2", kind: "goal", start: 800, H: x => 760 - (x < 340 ? 0 : 55 * Math.sin((x - 340) / 180)),
    deco: [["🌞", 1460, 130, 120], ["☁️", 700, 150, 110], ["🌷", 1520, 640, 70]] },
  { sky: ["#e0c3fc", "#f7efff"], grass: "#b7e4c7", kind: "tramp", start: 800, H: () => 785,
    deco: [["☁️", 200, 130, 110], ["🌈", 1400, 160, 160]],
    coll: [[350, 330], [800, 270], [1250, 330], [575, 470], [1025, 470]].map(p => ({ e: "⭐", x: p[0], y: p[1], ring: 0 })) },
  { sky: ["#caf0f8", "#effbff"], grass: "#ffd166", kind: "pipe", start: 800, H: hPipe,
    deco: [["☁️", 800, 140, 130], ["🌞", 1450, 110, 100]],
    coll: [{ e: "🔔", x: 105, y: 330, ring: 1 }, { e: "🔔", x: 1495, y: 330, ring: 1 }] },
  { sky: ["#ffd6a5", "#fff1e0"], grass: "#a7c957", kind: "hole", start: 110, H: hTrack,
    deco: [["☁️", 900, 150, 120], ["🌞", 1450, 120, 100], ["⛳", 1530, 640, 130]] },
  { sky: ["#d8f3dc", "#f1fbf3"], grass: "#52b788", kind: "apples", start: 518, H: hBumps,
    deco: [["☁️", 300, 130, 110], ["☁️", 1250, 160, 100]],
    coll: [173, 864, 1540].map(x => ({ e: "🍎", x, y: hBumps(x) - 80, ring: 0 })).concat([518, 1209].map(x => ({ e: "🍎", x, y: hBumps(x) - 150, ring: 0 }))) }
];
const PINS = [1000, 1095, 1190, 1285, 1380], PADS = [350, 800, 1250];
let cur = -1, b = null, night = false, lastThud = -999, hinted = false, busy = false, pins = [], got = [];
const ballB = () => BALLS[mem.ball];
function groundPath(P) {
  let d = "M-1200 1700L-1200 " + P.H(0).toFixed(1) + "L0 " + P.H(0).toFixed(1);
  for (let x = 10; x <= 1600; x += 10) d += "L" + x + " " + P.H(x).toFixed(1);

const emoT = (e, x, y, s, extra) => `<text class="emo"${extra || ""} x="${x}" y="${y + s * 0.36}" font-size="${s}" text-anchor="middle">${e}</text>`;
const pinArt = '<path d="M-18 0L-24 -60Q-30 -100 -14 -118Q-22 -140 0 -150Q22 -140 14 -118Q30 -100 24 -60L18 0Z" fill="#fff" stroke="#2b2d42" stroke-width="5" stroke-linejoin="round"/><path d="M-22 -92H22M-20 -78H20" stroke="#ef476f" stroke-width="8"/>';
function placeSVG(i, live) {
  const P = PLACES[i], B = ballB();

  }

  h += `<g${live ? ' id="ball"' : ""} transform="translate(${bx} ${by})">${emoT(B.e, 0, 0, B.r * 2)}</g>`;
  if (live) h += `<text id="hint" class="emo" x="${bx}" y="${by - B.r - 40}" font-size="70" text-anchor="middle">👇</text><rect id="night" x="-1200" y="-1200" width="4000" height="3000" fill="#0b1033" opacity="0" pointer-events="none"/>`;
  return `<svg${live ? ' id="svg"' : ""} viewBox="0 0 1600 900">${h}</svg>`;
}
function putBall() { $("ball").setAttribute("transform", `translate(${b.x.toFixed(1)} ${b.y.toFixed(1)}) rotate(${b.rot.toFixed(1)})`); }
function spawn() { const P = PLACES[cur]; b = { x: P.start, y: P.H(P.start) - ballB().r - 2, vx: 0, vy: 0, rot: 0 }; }
function open(i) {
  cur = i; clearClock(); night = false; busy = false; hinted = false;
  $("pic").innerHTML = placeSVG(i, true);
  spawn();
  pins = PINS.map(x => ({ x, down: false, a: 0, piv: 0 }));
  got = (PLACES[i].coll || []).map(() => false);
  putBall();
}
function thud(v) {
  if (now - lastThud < 90) return; lastThud = now;
  const B = ballB(), k = Math.min(1, v / 1200);
  if (B.air) tone(300, 0.1, "sine", 0.1 * k + 0.03, 200); else { tone(140, 0.16, "sine", 0.25 + 0.3 * k, 70); noise(0.05, 0.08 + 0.15 * k, 900); }
}
function win(reset) { mem.done[cur] = 1; store(KEY, mem); after(250, burst); after(2600, reset); }
// --- skittles: one tips over the edge of its base, speeds up, hits the grass with a small bounce,
// and may knock the next one down (domino). Afterwards they pop back up one by one.
const pinEl = k => $("svg").querySelector(`.pin[data-k="${k}"]`);
function setPin(k, sc) { const p = pins[k]; pinEl(k).setAttribute("transform", `translate(${p.x} ${PLACES[cur].H(p.x)}) rotate(${p.a.toFixed(1)} ${p.piv} 0)${sc ? ` scale(${sc.toFixed(3)})` : ""}`); }
function knock(k, dir) {
  const p = pins[k]; if (!p || p.down) return;
  p.down = true; p.piv = dir * 18;
  tone(760, 0.06, "square", 0.06, 500);
  tween(480, t => { p.a = dir * 90 * t * t; setPin(k); }, () => {
    tone(420, 0.09, "triangle", 0.2, 300); thud(400);
    tween(200, t => { p.a = dir * (90 - 9 * Math.sin(t * Math.PI)); setPin(k); });
  });
  const nb = pins.findIndex(q => !q.down && Math.sign(q.x - p.x) === dir && Math.abs(q.x - p.x) < 120);
  if (nb >= 0 && Math.random() < 0.65) after(300, () => knock(nb, dir));
  if (pins.every(q => q.down)) win(() => pins.forEach((q, j) => after(j * 140, () => {
    q.a = 0; q.piv = 0; SFX.pop();
    tween(300, t => setPin(j, Math.max(0.01, popAt(t))), () => { q.down = false; setPin(j); });
  })));
}
function phys(h) {
  const B = ballB(), P = PLACES[cur];
  b.vy += B.g * h;
  if (B.air) { b.vx *= 1 - B.air * h; b.vy *= 1 - B.air * 0.5 * h; }
  const py = b.y;
  b.x += b.vx * h; b.y += b.vy * h;
  if (b.x < B.r) { b.x = B.r; if (b.vx < 0) { thud(-b.vx); b.vx = -b.vx * 0.7; } }
  if (b.x > 1600 - B.r) { b.x = 1600 - B.r; if (b.vx > 0) { thud(b.vx); b.vx = -b.vx * 0.7; } }
  if (b.y < B.r - 300) { b.y = B.r - 300; if (b.vy < 0) b.vy = -b.vy * 0.5; }
  if (P.kind === "tramp" && b.vy > 0) PADS.forEach((x, k) => {
    const top = 732;
    if (b.x > x - 105 && b.x < x + 105 && b.y + B.r >= top && py + B.r <= top + 6) {
      b.y = top - B.r; b.vy = -Math.min(1500, Math.max(B.air ? 500 : 980, b.vy * 1.02)); SFX.boing();
      const m = $("svg").querySelectorAll(".mat")[k]; tween(220, t => m.setAttribute("transform", `translate(0 ${(14 * Math.sin(t * Math.PI)).toFixed(1)})`));
    }
  });
  const gy = P.H(b.x), d = (P.H(b.x + 2) - P.H(b.x - 2)) / 4, len = Math.hypot(d, 1), nx = d / len, ny = -1 / len, pen = (b.y + B.r - gy) / len;
  if (pen > 0) {
    b.x += nx * pen; b.y += ny * pen;
    const vn = b.vx * nx + b.vy * ny;
    if (vn < 0) { const e = -vn > 90 ? B.b : 0; b.vx -= (1 + e) * vn * nx; b.vy -= (1 + e) * vn * ny; if (-vn > 200) thud(-vn); }
    b.vx *= 1 - 0.5 * h; if (Math.abs(b.vx) < 4 && Math.abs(d) < 0.02) b.vx = 0;
  }
  b.rot += B.air ? (b.vx * 0.02 - b.rot) * Math.min(1, 6 * h) : b.vx * h / B.r * 57.3;
  if (P.kind === "pins") pins.forEach((p, k) => { if (!p.down && Math.hypot(b.x - p.x, b.y - (P.H(p.x) - 75)) < B.r + 32) { knock(k, b.vx >= 0 ? 1 : -1); b.vx *= 0.75; } });
  if (P.kind === "goal" && !busy && b.x < 235 && b.y > 560) { busy = true; win(() => { spawn(); b.y = 150; busy = false; SFX.pop(); }); }
  if (P.kind === "hole" && !busy && b.y > 950) { busy = true; tone(300, 0.5, "sine", 0.2, 900); win(() => { spawn(); busy = false; SFX.pop(); }); }
  (P.coll || []).forEach((c, k) => {
    if (got[k] || Math.hypot(b.x - c.x, b.y - c.y) > B.r + 60) return;
    got[k] = true; const g = $("svg").querySelector(`[data-c="${k}"]`);
    if (c.ring) {   // a bell: it swings and rings, and stays lit
      [1568, 1319, 1568].forEach((f, i) => tone(f, 0.5, "triangle", 0.18, null, i * 0.15));
      tween(900, t => g.setAttribute("transform", `rotate(${(25 * Math.sin(t * Math.PI * 4) * (1 - t)).toFixed(1)} ${c.x} ${c.y - 40})`));
      g.setAttribute("opacity", "1"); g.style.filter = "drop-shadow(0 0 12px #ffd60a)";
    } else { SFX.chime(); tween(250, q => g.setAttribute("opacity", (1 - q).toFixed(2))); }
    if (got.every(v => v)) win(() => { got = got.map(() => false); $("svg").querySelectorAll("[data-c]").forEach(el => { el.setAttribute("opacity", "1"); el.style.filter = ""; }); SFX.pop(); });
  });
}
ticks.push(dt => {
  if (cur < 0 || night || !$("ball")) return;
  const n = Math.max(1, Math.ceil(dt / 8)), h = dt / n / 1000;
  for (let i = 0; i < n; i++) phys(h);
  putBall();
});
// Tap: kick towards the finger, or a big jump when the ball itself is tapped
function kick(px, py) {
  if (cur < 0) return;
  if (night) { setNight(false); return; }
  const B = ballB();
  if (!hinted) { hinted = true; const hn = $("hint"); if (hn) hn.remove(); }
  if (Math.hypot(px - b.x, py - b.y) < B.r * 1.4) { b.vy = -(B.air ? 520 : 1150); b.vx += Math.random() * 200 - 100; SFX.boing(); return; }
  const dx = px - b.x;
  b.vx = Math.max(-1100, Math.min(1100, dx * 2.2));
  b.vy = -Math.min(B.air ? 600 : 1100, (B.air ? 150 : 320) + Math.max(0, b.y - py) * 1.4);
  SFX.pop();
}
function setNight(n) {
  night = n; $("night").setAttribute("opacity", n ? "0.6" : "0"); $("moon").textContent = n ? "🌞" : "🌙";
  if (n) [523, 440, 392, 330, 262].forEach((f, i) => tone(f, 0.6, "sine", 0.15, null, i * 0.3)); else SFX.chime();
}
function setBall(i) {
  mem.ball = i; store(KEY, mem);
  document.querySelectorAll("#pal .tp").forEach(el => el.classList.toggle("sel", +el.dataset.b === i));
  if (cur < 0) return;
  const B = ballB(); $("ball").innerHTML = emoT(B.e, 0, 0, B.r * 2); b.vy = Math.min(b.vy, -300); SFX.boing();
}
$("pic").addEventListener("pointerdown", e => { if (cur < 0 || !$("svg")) return; const [x, y] = scenePt($("svg"), e.clientX, e.clientY); kick(x, y); });
$("moon").addEventListener("pointerdown", () => { if (cur >= 0) setNight(!night); });
$("pal").innerHTML = BALLS.map((B, i) => `<div class="tp" data-b="${i}"><span class="emo">${B.e}</span></div>`).join("");
$("pal").addEventListener("pointerdown", e => { const el = e.target.closest("[data-b]"); if (el) setBall(+el.dataset.b); });
setBall(mem.ball);
gallery.setup({ n: PLACES.length, thumb: i => placeSVG(i, false), done: i => !!mem.done[i], open });
Object.assign(__game, { mem, open: i => gallery.pick(i), kick, setBall, setNight, PLACES, st: () => ({ cur, night, b: b && { x: Math.round(b.x), y: Math.round(b.y), vx: Math.round(b.vx), vy: Math.round(b.vy) }, pins: pins.map(p => p.down), got: got.slice() }) });
</script>
<script id="fullscreen">/* Games always play fullscreen. A browser only allows it on a tap or a click, so it is asked on the first one (the big play button) and again if fullscreen was left. */
(function () {
  function go() {
    var d = document, e = d.documentElement;
    if (d.fullscreenElement || d.webkitFullscreenElement) return;
    var f = e.requestFullscreen || e.webkitRequestFullscreen;
    if (!f) return;
    try { var p = f.call(e, { navigationUI: "hide" }); if (p && p.catch) p.catch(function () {}); } catch (_) {}
  }
  ["pointerdown", "pointerup", "keydown"].forEach(function (t) { addEventListener(t, go, true); });
})();
</script>
